<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b36"><title>Helpdesk – Deine erste Schicht</title><meta name="description" content="Fünf interaktive Lektionen für Ihren Einstieg am Schul-Helpdesk."><style>
:root{--ink:#16323c;--navy:#142b36;--teal:#087f74;--lime:#daf18a;--paper:#f5f5ef;--muted:#60747b;--line:#dce3de;--white:#fff;--red:#a53e31}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button,a,input,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:var(--teal)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(32px,4vw,48px);line-height:1.13;letter-spacing:-1.5px;margin-bottom:16px}h2{font-size:26px;line-height:1.25}h3{font-size:19px}.shell{display:grid;grid-template-columns:262px 1fr;min-height:100vh}.side{background:var(--navy);color:#e3ecea;padding:30px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px}.brand{font-weight:850;font-size:25px;letter-spacing:-1px}.brand span{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--lime);color:var(--navy);border-radius:10px;margin-right:7px}.small{font-size:13px}.muted{color:var(--muted)}.side .muted{color:#a4b9bd}.nav{display:grid;gap:7px}.nav button{background:none;color:#b5c9ca;border:0;text-align:left;padding:12px;border-radius:10px;line-height:1.35;font-size:14px}.nav button.active,.nav button:hover{background:#29434d;color:white}.nav b{display:block;color:#fff}.nav .num{float:left;width:28px;color:var(--lime)}.sidefooter{margin-top:auto}.main{min-width:0}.topbar{padding:18px 42px;background:#ffffffb8;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:13px}.status{color:var(--teal)}.status.bad{color:var(--red)}.wrap{max-width:1120px;padding:40px 42px 60px;margin:auto}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--teal);margin-bottom:12px}.hero{background:var(--navy);color:#fff;border-radius:22px;padding:36px;display:grid;grid-template-columns:1.5fr 1fr;gap:25px;position:relative;overflow:hidden}.hero .eyebrow{color:var(--lime)}.hero p{color:#bcd0d0;max-width:580px}.desk{display:grid;place-items:center;min-height:200px}.monitor{background:#26444e;border:1px solid #65828a;border-radius:14px;padding:18px;width:240px;transform:rotate(-5deg);box-shadow:14px 15px 0 #0c2029}.monitor .screen{background:#eaf0e6;color:var(--ink);border-radius:7px;padding:15px;font-size:13px}.screen i{display:block;background:var(--lime);font-style:normal;font-weight:bold;border-radius:5px;padding:5px;margin-top:8px}.btn{background:var(--teal);color:white;border:1px solid var(--teal);border-radius:9px;padding:11px 18px;font-weight:700;display:inline-block;text-decoration:none}.btn.light{background:var(--lime);border-color:var(--lime);color:var(--navy)}.btn.secondary{background:white;color:var(--ink);border-color:var(--line)}.btn.ghost{background:transparent;border-color:#64808a;color:white}.btn.small{padding:7px 12px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0 32px}.stat{background:white;border:1px solid var(--line);padding:20px;border-radius:14px}.stat strong{font-size:28px;display:block}.cards{display:grid;gap:14px}.lesson{display:grid;grid-template-columns:56px 1fr auto;gap:18px;align-items:center;background:white;border:1px solid var(--line);padding:22px;border-radius:14px}.lesson h3{margin:0 0 3px}.badge{display:grid;place-items:center;width:52px;height:52px;background:#e8f0df;color:var(--teal);border-radius:14px;font-weight:800;font-size:21px}.pill{font-size:12px;background:#edf3ec;border-radius:30px;padding:4px 10px;display:inline-block;font-weight:650}.progress{height:6px;background:#e4eae5;border-radius:9px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--teal)}.notice{background:#eaf0e3;border-left:3px solid var(--teal);padding:16px 18px;border-radius:0 10px 10px 0;margin:22px 0}.panel{background:white;border:1px solid var(--line);padding:28px;border-radius:18px;margin:20px 0}.activity{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:22px}.brief{background:#edf3eb;padding:20px;border-radius:14px;font-size:14px}.brief p:last-child{margin-bottom:0}.quote{background:#f1f4f1;border-radius:12px;padding:20px;margin-bottom:23px}.avatar{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:50%;background:var(--navy);color:var(--lime);font-weight:800;margin-right:9px}.quote p{margin:14px 0 0;font-size:19px}.question{font-size:18px;font-weight:700;margin:0 0 18px}.options{display:grid;gap:10px}.option{background:white;border:1.5px solid var(--line);padding:15px 18px;border-radius:10px;text-align:left;width:100%;color:var(--ink);display:flex;gap:12px;align-items:flex-start}.option:hover{border-color:var(--teal);background:#f5faf7}.option.selected{border-color:var(--teal);background:#eaf5ef}.option .marker{flex:0 0 24px;width:24px;height:24px;border-radius:6px;background:#edf2eb;text-align:center;font-size:13px;font-weight:750}.option.selected .marker{background:var(--teal);color:white}.feedback{padding:18px;border-radius:12px;background:#e9f5eb;margin:20px 0;animation:arrive .2s ease}.feedback.wrong{background:#fff0e5}.feedback p{margin-bottom:0}.feedback strong{display:block;margin-bottom:5px}.field{display:block;font-weight:650;margin:15px 0 6px}textarea,input[type=text]{width:100%;padding:12px;background:#fcfdf9;border:1px solid #b6c6c2;border-radius:9px;color:var(--ink)}textarea{min-height:110px;resize:vertical}.actions{margin-top:24px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.hint{font-size:13px;color:var(--muted);margin-top:8px}.inspector{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0}.hotspot{padding:24px 10px;background:#edf2e8;border:1px dashed #7c9e96;border-radius:12px;color:var(--ink);font-weight:700}.hotspot.seen{background:#dcecd8;border-style:solid}.evidence{font-size:14px;border-left:3px solid var(--teal);padding:9px 13px;margin:8px 0;background:#f6f8f3}.orderrow{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:9px;margin:10px 0}.orderrow span{flex:1}.orderrow button{border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:white}.listclean{padding-left:20px}.glossary{display:grid;gap:12px}.glossary details{background:white;border:1px solid var(--line);border-radius:10px;padding:15px 20px}.glossary summary{cursor:pointer;font-weight:750}.glossary p{margin:12px 0 0}.checklabel{background:var(--lime);color:var(--navy);padding:8px 14px;border-radius:8px;font-weight:750}.footerline{font-size:12px;color:var(--muted);margin-top:35px}.empty{padding:30px;text-align:center}dialog{border:1px solid var(--line);border-radius:18px;padding:28px;max-width:500px;width:90%;color:var(--ink)}dialog::backdrop{background:#102d3ab0}.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:white;padding:14px 22px;border-radius:12px;box-shadow:0 4px 30px #0003;z-index:20;max-width:calc(100% - 40px)}.skip{position:absolute;left:-1000px}.skip:focus{left:20px;top:10px;z-index:100;background:white;padding:10px}.hide{display:none!important}@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:1000px){.activity{grid-template-columns:1fr}.brief{order:-1}.side{width:215px}.shell{grid-template-columns:215px 1fr}.wrap{padding:28px 24px}.topbar{padding:15px 24px}.hero{grid-template-columns:1fr}.desk{display:none}}@media(max-width:700px){.shell{display:block}.side{width:auto;height:auto;position:relative;padding:16px;gap:14px}.brand{font-size:22px}.nav{display:flex;overflow:auto}.nav button{min-width:145px;padding:9px}.sidefooter{display:none}.wrap{padding:22px 16px}.hero{padding:25px}.topbar{padding:12px 16px}.lesson{grid-template-columns:42px 1fr;padding:17px;gap:13px}.lesson .btn{grid-column:2}.badge{width:40px;height:40px;font-size:17px}.stats{gap:8px}.stat{padding:12px;font-size:12px}.stat strong{font-size:24px}.panel{padding:20px}.activity{gap:5px}h1{font-size:34px}}
</style></head><body><a class="skip" href="#main">Zum Inhalt</a><div class="shell"><aside class="side"><div><div class="brand"><span>H</span> helpdesk<span style="color:var(--lime);background:none;width:auto;margin:0">.</span></div><div class="small muted" style="margin-top:6px">DEINE ERSTE SCHICHT · CLUSTER 1</div></div><nav class="nav" id="nav" aria-label="Lektionen"></nav><div class="sidefooter"><div class="small muted">Ihr Werkzeugkasten</div><button class="btn ghost small" onclick="go('handbook')" style="margin-top:10px">Handbuch öffnen ↗</button><p class="small muted" style="margin-top:16px">Sorgfalt vor Tempo.<br>Nachfragen ist eine Stärke.</p></div></aside><div class="main"><header class="topbar"><div>Schul-Helpdesk <span class="muted">/ Grundlagentraining</span></div><span class="status" id="saveStatus" role="status">● Spielstand bereit</span></header><main class="wrap" id="main" tabindex="-1"></main></div></div><input id="importFile" type="file" accept="application/json,.json" class="hide"><dialog id="confirmDialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div class="row"><button class="btn" id="dialogYes">Bestätigen</button><button class="btn secondary" onclick="document.querySelector('dialog').close()">Abbrechen</button></div></dialog><script>window.HELPDESK_OFFLINE=true;</script><script>const C=(title,person,message,prompt,options,correct,why)=>({type:'choice',title,person,message,prompt,options,correct,why});
const M=(title,person,message,prompt,options,correct,why)=>({type:'multi',title,person,message,prompt,options,correct,why});
const R=(title,prompt,example)=>({type:'reflect',title,prompt,example});
const F=(title,person,message,fields,why)=>({type:'form',title,person,message,fields,why});
const O=(title,prompt,items,why)=>({type:'order',title,prompt,items,why});
const lessons=[
{id:1,title:'Am Helpdesk ankommen',sub:'Ihre erste Anlaufstelle',icon:'01',goal:'Sie erklären die Aufgabe des Helpdesks, nehmen Anliegen freundlich auf und erkennen die Grenzen Ihrer Rolle.',brief:'Ein Helpdesk ist die erste Anlaufstelle für vereinbarte IT-Anliegen. Er nimmt Meldungen auf, klärt sie, hilft bei einfachen Fällen und organisiert die Weitergabe. Er muss nicht jedes Problem selbst lösen. In diesem Spiel gelten die gezeigten Schulregeln; am echten Helpdesk gelten die Vorgaben Ihrer Lehrperson.',steps:[
C('Ein guter Start','Frau Keller · Lehrperson','Guten Morgen. Mein Laptop macht schon wieder Probleme.','Wie eröffnen Sie das Gespräch?',['Was haben Sie denn schon wieder gemacht?','Guten Morgen. Ich schaue mit Ihnen hin. Was funktioniert gerade nicht?','Das ist wahrscheinlich ein Windows-Fehler.'],1,'Eine freundliche, offene Frage hilft, das Anliegen zu verstehen. Vermutungen und Schuldzuweisungen helfen am Anfang nicht.'),
M('Unsere Aufgabe','Helpdesk-Leitung','Wir unterstützen die Schule bei vereinbarten IT-Anliegen.','Welche Tätigkeiten gehören dazu?',['Anliegen aufnehmen und dokumentieren','Alle technischen Änderungen ohne Rücksprache durchführen','Einfache freigegebene Lösungen anwenden','Fälle an zuständige Fachpersonen weitergeben','Jedes Problem sofort selbst lösen müssen'],[0,2,3],'Aufnehmen, einfach helfen und sinnvoll weitergeben gehören zusammen. Zuständigkeit und Berechtigung setzen Grenzen.'),
C('Der tropfende Wasserhahn','Luca · Lernender','Im WC tropft ein Wasserhahn. Können Sie das reparieren?','Wie reagieren Sie?',['Das ist uns egal.','Ich repariere ihn schnell selbst.','Dafür ist der Hausdienst zuständig. Ich zeige Ihnen, wie Sie ihn erreichen.'],2,'Auch bei einer fachfremden Anfrage bleiben Sie freundlich und verweisen an die passende Stelle.'),
C('Der vergessene Zugang','Mira · Lernende','Ich habe mein Schulpasswort vergessen. Können Sie ein neues setzen?','Schulregel: Lernende am Helpdesk dürfen keine Konten zurücksetzen. Was tun Sie?',['Anliegen aufnehmen und den freigegebenen Weg über die zuständige Person nutzen','Nach dem privaten Passwort fragen, vielleicht ist es gleich','Mit einem anderen Schülerkonto anmelden'],0,'Sie helfen beim richtigen Ablauf. Konten bearbeiten dürfen nur berechtigte Personen nach dem vorgesehenen Identitätsprüfprozess.'),
R('In eigenen Worten','Erklären Sie einer neuen Mitschülerin in zwei bis drei Sätzen: Wozu gibt es unseren Helpdesk? Nennen Sie auch eine Grenze.','Der Helpdesk nimmt IT-Anliegen auf und hilft bei einfachen Fällen. Wenn uns Wissen oder Berechtigungen fehlen, dokumentieren wir das Anliegen und holen die zuständige Person dazu.'),
C('Ein Anliegen ist noch keine Diagnose','Herr Frei · Lehrperson','Der Drucker ist kaputt!','Was wissen Sie bisher sicher?',['Der Drucker muss ersetzt werden.','Die Person kann momentan nicht wie gewünscht drucken. Die Ursache ist noch offen.','Das Netzwerk ist ausgefallen.'],1,'Die Meldung beschreibt zunächst eine Beobachtung beziehungsweise ein Anliegen. Die Ursache müssen Sie erst eingrenzen.'),
F('Eine hilfreiche Weiterleitung','Sam · Lernender','Ich brauche einen neuen Schülerausweis.','response','Für Schülerausweise ist in dieser Spielschule das Sekretariat zuständig. Eine gute Antwort benennt die passende Stelle und bietet Orientierung.'),
R('Brücke zum echten Helpdesk','Notieren Sie zwei IT-Anliegen, die an Ihrer Schule vorkommen könnten. Ergänzen Sie eine Frage an die Lehrperson: Was dürfen Sie dabei selbst machen?','Zum Beispiel: WLAN-Verbindung und Druckprobleme. Darf ich ein Gerät neu verbinden oder soll ich zuerst Rücksprache halten?')],check:[
C('Aufgabe erkennen','Neue Kollegin','Muss der Helpdesk alles selbst reparieren?','Welche Erklärung trifft zu?',['Ja, sonst ist es kein Helpdesk.','Nein. Er nimmt Anliegen auf, hilft im vereinbarten Rahmen und organisiert nötige Weitergaben.','Nein. Er leitet grundsätzlich alles weiter.'],1,'Der Helpdesk verbindet Anlaufstelle, einfache Unterstützung und koordinierte Weitergabe.'),
C('Zuständigkeit beachten','Lehrperson','Bitte installieren Sie schnell eine kostenpflichtige App.','Sie dürfen keine Software installieren. Was tun Sie?',['Anfrage aufnehmen und an die zuständige Person geben','Mit einem fremden Administratorkonto installieren','Die Anfrage ohne Erklärung löschen'],0,'Ein Wunsch wird aufgenommen und über den erlaubten Weg geprüft.'),
C('Freundlich bleiben','Lernender','Das Internet ist Müll!','Wie beginnen Sie?',['Bei mir geht es.','Beruhigen Sie sich erst einmal.','Was möchten Sie gerade öffnen, und was passiert dabei?'],2,'Eine konkrete, sachliche Rückfrage bringt Sie weiter.') ]},
{id:2,title:'Das Anliegen verstehen',sub:'Gute Fragen öffnen Türen',icon:'02',goal:'Sie reagieren respektvoll, stellen gezielte Rückfragen und fassen ein Anliegen verständlich zusammen.',brief:'Erst verstehen, dann handeln. Beginnen Sie offen und fragen Sie anschliessend gezielt nach: Was sollte passieren? Was passiert tatsächlich? Seit wann? Welches Gerät oder Programm? Wen betrifft es? Fragen Sie nicht alles gleichzeitig und verlangen Sie niemals ein Passwort.',steps:[
C('Teams geht nicht','Noah · Lernender','Teams geht nicht. Ich muss eine Aufgabe abgeben.','Welche erste Rückfrage hilft am meisten?',['Welche Teams-Funktion klappt nicht, und was sehen Sie dabei?','Warum haben Sie nicht früher abgegeben?','Wie lautet Ihr Passwort?'],0,'Die konkrete Funktion und die beobachtete Reaktion grenzen das Anliegen ein.'),
M('Was fehlt uns noch?','Noah · Lernender','Teams öffnet sich. Beim Hochladen erscheint «Upload fehlgeschlagen».','Welche Informationen sind jetzt sinnvoll?',['Seit wann tritt das auf?','Betrifft es nur diese Datei oder auch eine kleine Testdatei?','Wie heisst Ihr Haustier?','Gilt das Problem auch bei anderen Lernenden?'],[0,1,3],'Zeitpunkt, Umfang und Vergleich helfen bei der Eingrenzung. Private Nebensachen sind unnötig.'),
C('Die genervte Kundin','Frau Meier · Lehrperson','Ich war schon gestern hier! Immer muss ich alles doppelt sagen.','Welche Antwort passt?',['Das ist nicht mein Problem.','Ich verstehe, dass das mühsam ist. Gibt es bereits ein Ticket, damit wir dort anknüpfen können?','Sie müssen mir trotzdem alles erzählen.'],1,'Sie erkennen den Ärger an und nutzen vorhandene Informationen, statt doppelte Arbeit zu erzeugen.'),
F('Verständlich statt technisch','Herr Braun · Lehrperson','Ich kenne mich damit nicht aus. Was soll ich jetzt machen?','explain','Formulieren Sie eine kurze Handlung in einfachen Worten. Lassen Sie die Person einen Schritt ausführen und danach berichten. Fachbegriffe erklären Sie bei Bedarf.'),
C('Zuhören und zusammenfassen','Elif · Lernende','Seit heute Morgen öffnet sich meine PDF-Datei nicht. Andere PDFs gehen. Ich habe sie gestern per Mail bekommen.','Welche Zusammenfassung passt?',['Auf Ihrem Gerät gehen seit gestern keine Dateien.','Seit heute lässt sich eine bestimmte PDF aus einer Mail nicht öffnen; andere PDFs funktionieren.','Ihr E-Mail-Programm ist defekt.'],1,'Eine gute Zusammenfassung erhält die wichtigen Unterschiede und fügt keine Diagnose hinzu.'),
O('Ein klares Gespräch','Bringen Sie die Gesprächsschritte in eine sinnvolle Reihenfolge.',['Freundlich begrüssen und offen nach dem Anliegen fragen','Mit gezielten Rückfragen die Situation klären','Das Anliegen zusammenfassen und Verständnis prüfen','Den nächsten Schritt verständlich erklären'],'Erst klären Sie das Anliegen. Danach können Sie einen passenden nächsten Schritt vereinbaren.'),
R('Fragen selbst formulieren','Eine Person sagt: «Ich habe keinen Ton.» Schreiben Sie drei unterschiedliche Rückfragen. Fragen Sie nach der Situation, dem Umfang und dem Zeitpunkt.','Bei welcher Anwendung fehlt der Ton? Geht der Ton über Kopfhörer? Seit wann fällt Ihnen das auf?'),
C('Keine falschen Versprechen','Frau Meier · Lehrperson','Ist das in fünf Minuten gelöst?','Sie kennen die Ursache noch nicht. Was antworten Sie?',['Garantiert.','Ich kann die Dauer noch nicht sicher sagen. Ich prüfe zuerst die einfachen Ursachen und informiere Sie über den nächsten Schritt.','Keine Ahnung.'],1,'Sie kommunizieren ehrlich und erklären trotzdem, wie es weitergeht.')],check:[
C('Gezielt nachfragen','Lehrperson','Mein Beamer zeigt kein Bild.','Welche Rückfrage klärt das Anliegen?',['Wird am Beamer eine Meldung angezeigt, und ist der Laptopbildschirm sichtbar?','Was kostet der Beamer?','Können Sie mir Ihr Passwort geben?'],0,'Beobachtbare Anzeigen helfen bei der Eingrenzung.'),
C('Sachlich reagieren','Lernende','Ich habe jetzt wirklich keine Zeit für so etwas!','Welche Antwort hilft?',['Dann kommen Sie später.','Ich sehe, dass es dringend für Sie ist. Was müssen Sie gerade erledigen?','Sie müssen Geduld lernen.'],1,'Sie bleiben respektvoll und klären den konkreten Bedarf.'),
C('Richtig zusammenfassen','Lernender','Eine Website lädt nicht. Andere Websites laden. Seit der Pause.','Welche Zusammenfassung stimmt?',['Das gesamte Internet ist seit heute ausgefallen.','Der Laptop hat keinen Strom.','Seit der Pause ist eine bestimmte Website nicht erreichbar; andere laden.'],2,'Beobachtung, Umfang und Zeitpunkt bleiben erhalten.') ]},
{id:3,title:'Ein gutes Ticket',sub:'Damit nichts verloren geht',icon:'03',goal:'Sie erklären den Nutzen von Tickets und dokumentieren ein Anliegen sachlich und nachvollziehbar.',brief:'Ein Ticket ist der nachvollziehbare Datensatz zu einem Anliegen. Es hält fest, wer betroffen ist, worum es geht, was beobachtet wurde, was bereits versucht wurde und wie es weitergeht. Es unterstützt Zusammenarbeit und verhindert, dass Informationen verloren gehen. Passwörter gehören nie hinein.',steps:[
C('Warum aufschreiben?','Helpdesk-Leitung','Ein Fall ist in zwei Minuten gelöst. Brauchen wir überhaupt eine Dokumentation?','Was ist der beste Grund dafür?',['Damit die Liste länger wird.','Damit Anliegen und Lösung später nachvollziehbar sind und andere daran anknüpfen können.','Damit wir möglichst viele persönliche Daten sammeln.'],1,'Auch kurze Fälle können für wiederkehrende Störungen und gemeinsame Arbeit nützlich sein. Dokumentieren Sie nach den Schulvorgaben.'),
M('Was gehört ins Ticket?','Ticket #031','Mila kann am Laptop BWS-14 seit der Pause nicht drucken.','Welche Angaben gehören in die Dokumentation?',['Betroffene Person und geeigneter Kontakt','Gerät, Anwendung und konkrete Beobachtung','Das Passwort der Person','Bisherige Prüfungen und deren Ergebnisse','Persönliche Bewertung: «stellt sich dumm an»'],[0,1,3],'Dokumentation soll sachlich, relevant und nachvollziehbar sein. Passwörter und abwertende Kommentare gehören nicht hinein.'),
C('Ein Titel, der hilft','Neues Ticket','Im Zimmer 204 zeigt der Beamer nach dem Anschliessen des Laptops «Kein Signal».','Welcher Titel ist am hilfreichsten?',['Hilfe!!!','Beamer defekt, sofort ersetzen','Zimmer 204: Beamer zeigt «Kein Signal»'],2,'Ein konkreter Titel benennt Ort, Gerät und beobachtetes Verhalten, ohne eine ungesicherte Ursache zu behaupten.'),
F('Ihr erstes vollständiges Ticket','Frau Keller · Lehrperson','Zimmer 204, Laptop BWS-08. Seit 10 Uhr zeigt der Beamer «Kein Signal». Der Laptopbildschirm funktioniert. Das HDMI-Kabel wurde an beiden Enden geprüft; die Meldung bleibt. Kontakt über Schul-Teams.','ticket','Vergleichen Sie Ihre Angaben mit der Meldung. Trennen Sie Beobachtungen von Vermutungen. Halten Sie bei Prüfungen auch das Ergebnis fest.'),
C('Beobachtung oder Vermutung?','Ticketentwurf','«Der WLAN-Chip ist kaputt.» Bisher wurde nur beobachtet, dass ein Gerät nicht verbunden ist.','Wie verbessern Sie den Eintrag?',['Das Gerät verbindet sich aktuell nicht mit dem Schul-WLAN; Ursache noch ungeklärt.','Der Laptop ist Schrott.','Alle Geräte sind offline.'],0,'Schreiben Sie zunächst auf, was tatsächlich festgestellt wurde.'),
C('Ein Ticket wartet','Ticket #031','Sie brauchen eine Rückmeldung der betroffenen Person, bevor Sie weitermachen können.','Welcher Status passt in unserem Spiel?',['Gelöst','Wartet auf Rückmeldung','Löschen'],1,'Ein wartender Fall ist noch nicht gelöst. Notieren Sie, welche Information fehlt und wer als Nächstes handelt.'),
F('Die nächste Person übernimmt','Übergabe','Sie haben das Kabel geprüft: fest angeschlossen. Der Beamer meldet weiterhin «Kein Signal». Eine Fachperson übernimmt.','handover','Nennen Sie Anliegen, Gerät beziehungsweise Ort, bisherige Schritte mit Ergebnissen und den Grund der Weitergabe. Die Fachperson sollte nicht von vorne anfangen müssen.'),

const glossary=[['Helpdesk','Erste Anlaufstelle für vereinbarte IT-Anliegen: aufnehmen, klären, einfach helfen und Weitergaben organisieren.'],['Ticket','Nachvollziehbare Dokumentation eines Anliegens mit Informationen, Bearbeitungsstand, Zuständigkeit und Ergebnissen.'],['First-Level-Support','Erste Anlaufstelle; bearbeitet bekannte, einfache Fälle nach vereinbarten Abläufen und gibt andere Fälle weiter.'],['Second-Level-Support','Fachpersonen mit vertieftem Wissen, die komplexere Fälle übernehmen. Die genaue Zuständigkeit hängt von der Organisation ab.'],['Third-Level-Support','Hoch spezialisierte Unterstützung, beispielsweise durch Hersteller oder Entwicklung. Kein zwingender Schritt für jeden Fall.'],['Incident','Ungeplante Unterbrechung oder Qualitätsminderung eines IT-Dienstes, etwa ein bisher funktionierender Drucker, der nicht mehr druckt.'],['Service Request','Reguläre Anfrage nach einer vereinbarten Leistung, beispielsweise einer freigegebenen Softwarebereitstellung.'],['Feature Request','Wunsch nach einer neuen oder erweiterten Funktion. Der Wunsch ist noch keine Zusage zur Umsetzung.'],['Problem','Zugrunde liegende oder mögliche Ursache eines oder mehrerer Incidents. Nicht einfach ein anderes Wort für jedes Ticket.'],['Priorität','Bearbeitungsreihenfolge anhand von Auswirkungen und Dringlichkeit nach vereinbarten Regeln. Lautstärke oder Status einer Person allein bestimmen sie nicht.'],['Weitergabe / Eskalation','Einen Fall mit den nötigen Informationen an die zuständige Stelle geben, etwa weil Wissen, Berechtigung oder Zuständigkeit fehlen.']];
</script><script>'use strict';
const KEY='bws-helpdesk-cluster1-v1';
const fresh=()=>({app:'bws-helpdesk',version:1,updatedAt:null,lastLesson:1,lessons:{}});
let state=fresh(),storageOK=true,view='home',current=1,screen='intro',step=0,selected=[],feedback=null,order=[],opened=[],checkIndex=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function valid(s){if(!s||s.app!=='bws-helpdesk'||s.version!==1||!Number.isInteger(s.lastLesson)||s.lastLesson<1||s.lastLesson>5||!s.lessons||typeof s.lessons!=='object'||Array.isArray(s.lessons))return false;for(const [id,p]of Object.entries(s.lessons)){if(![1,2,3,4,5].includes(Number(id))||!p||typeof p!=='object'||!Number.isInteger(p.progress)||p.progress<0||p.progress>8||!p.drafts||typeof p.drafts!=='object'||Array.isArray(p.drafts)||!Number.isInteger(p.attempts)||p.attempts<0||!Number.isInteger(p.best)||p.best<0||p.best>3||typeof p.passed!=='boolean'||!Array.isArray(p.checkAnswers)||p.checkAnswers.length>3||p.checkAnswers.some(a=>!a||!Array.isArray(a.selected)||a.selected.some(n=>!Number.isInteger(n)||n<0||n>10)))return false;}return true;}
try{const saved=localStorage.getItem(KEY);if(saved){const parsed=JSON.parse(saved);if(valid(parsed))state=parsed;else throw Error('invalid');}}catch(e){storageOK=false;}
function lp(id=current){return state.lessons[id]??=( {progress:0,drafts:{},checkAnswers:[],attempts:0,best:0,passed:false,completed:false,reviewed:{}} );}
function save(){state.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}saveLabel();}
function saveLabel(){let el=document.getElementById('saveStatus');el.className='status'+(storageOK?'':' bad');el.textContent=storageOK?'● Automatisch gespeichert':'⚠ Speicherung nicht verfügbar – Spielstand sichern';}
function toast(t){document.querySelector('.toast')?.remove();let x=document.createElement('div');x.className='toast';x.setAttribute('role','status');x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),5000);}
function resetActivity(){selected=[];feedback=null;order=[];opened=[];}
function go(v){view=v;render();focusMain();}
function focusMain(){document.getElementById('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function openLesson(id){current=id;state.lastLesson=id;view='lesson';screen='intro';resetActivity();save();render();focusMain();}
function startLesson(){const p=lp();if(p.progress>=lessons[current-1].steps.length){startCheck();return;}step=p.progress;screen='activity';resetActivity();save();render();focusMain();}
function replayLesson(){confirmAction('Lektion nochmals üben?','Die Übungen starten von vorne. Ihr bisher bestes Check-Ergebnis bleibt erhalten.',()=>{const p=lp();p.progress=0;p.drafts={};p.reviewed={};p.checkAnswers=[];p.completed=false;startLesson();});}
function render(){document.getElementById('nav').innerHTML=`<button class="${view==='home'?'active':''}" onclick="go('home')"><b>Übersicht</b>Ihr Lernweg</button>`+lessons.map(l=>`<button class="${view==='lesson'&&current===l.id?'active':''}" onclick="openLesson(${l.id})"><span class="num">${state.lessons[l.id]?.passed?'✓':l.icon}</span><b>${esc(l.title)}</b>Lektion ${l.id} · ca. 30 Min.</button>`).join('')+`<button class="${view==='handbook'?'active':''}" onclick="go('handbook')"><b>Handbuch & Spielstand</b>Nachschlagen und sichern</button>`;document.getElementById('main').innerHTML=view==='home'?home():view==='handbook'?handbook():lessonView();saveLabel();}
function totalXP(){return Object.values(state.lessons).reduce((n,p)=>n+p.progress*10+(p.passed?30:0),0);}
function home(){const done=Object.values(state.lessons).filter(p=>p.passed).length;return `<div class="hero"><div><div class="eyebrow">Mission: Menschen weiterhelfen</div><h1>Ihre erste Schicht.<br>Ein guter Anfang.</h1><p>Übernehmen Sie den Schul-Helpdesk. Hören Sie zu, finden Sie Hinweise und machen Sie aus einer unklaren Meldung einen nachvollziehbaren Fall.</p><button class="btn light" onclick="openLesson(${state.lastLesson||1})">${totalXP()?'Weiterlernen':'Erste Schicht starten'} →</button></div><div class="desk" aria-hidden="true"><div class="monitor"><div class="screen"><b>SUPPORT · EINGANG</b><p style="color:var(--muted);font-size:14px;margin-top:12px">«Es funktioniert nicht …»</p><i>Wir schauen gemeinsam hin.</i><div style="margin-top:18px">● Anliegen klären<br>○ Lösung nachvollziehen<br>○ Ergebnis festhalten</div></div></div></div></div><div class="stats"><div class="stat"><strong>${done}<span class="muted"> / 5</span></strong>Lernzielchecks bestanden</div><div class="stat"><strong>${totalXP()}</strong>Erfahrungspunkte</div><div class="stat"><strong>30 <span class="muted" style="font-size:15px">Min.</span></strong>Richtwert pro Lektion</div></div><div class="row between"><h2>Ihr Lernweg</h2><span class="pill">Modulcluster 1 · Grundlagen</span></div><div class="cards">${lessons.map(l=>{const p=state.lessons[l.id];const pc=Math.round((p?.progress||0)/l.steps.length*100);return `<article class="lesson"><div class="badge">${p?.passed?'✓':l.icon}</div><div><h3>${esc(l.title)}</h3><div class="small muted">${esc(l.sub)} · ${p?.passed?'Lernziel erreicht':p?.progress>=8?'Übungen abgeschlossen · Check offen':p?.progress?'In Bearbeitung':'Bereit zum Start'}</div><div class="progress" aria-label="Übungsfortschritt ${pc} Prozent"><i style="width:${pc}%"></i></div></div><button class="btn secondary" onclick="openLesson(${l.id})">${p?.progress?'Öffnen':'Starten'} →</button></article>`}).join('')}</div><div class="notice"><b>Ein echter Auftrag kommt zuerst.</b><br>Sie können jederzeit unterbrechen. Ihr Fortschritt und Ihre Texte werden nach jeder Änderung gespeichert. Verwenden Sie beim nächsten Mal denselben Browser und dasselbe Profil.</div><div class="row"><button class="btn secondary small" onclick="exportSave()">↓ Spielstand sichern</button><button class="btn secondary small" onclick="document.getElementById('importFile').click()">↑ Spielstand laden</button><button class="btn secondary small" onclick="downloadOffline()">↓ Offline-Spiel</button></div><p class="footerline">Fiktive Trainingsfälle. Verwenden Sie keine echten Namen, Passwörter oder vertraulichen Schuldaten. Die Zeitangaben sind Richtwerte, keine Zeitbegrenzung.</p>`;}
function lessonView(){const l=lessons[current-1],p=lp();if(screen==='check')return checkView(l,p);if(screen==='result')return resultView(l,p);if(screen==='activity')return activityView(l,p);return `<div class="eyebrow">Lektion ${current} · ca. 30 Minuten</div><h1>${esc(l.title)}</h1><p class="muted">${esc(l.sub)}</p><div class="panel"><h2>Das können Sie danach</h2><p>${esc(l.goal)}</p><div class="notice">${esc(l.brief)}</div><div class="row"><span class="pill">3 Min. Einstieg</span><span class="pill">22 Min. Missionen & eigene Anwendung</span><span class="pill">5 Min. Lernzielcheck</span></div><p class="hint">Nehmen Sie sich Zeit für eigene Formulierungen und den Vergleich mit den Rückmeldungen. Es gibt keinen Countdown.</p><div class="actions"><button class="btn" onclick="startLesson()">${p.progress>=8?'Zum Lernzielcheck':p.progress?'Bei Mission '+(p.progress+1)+' weiterfahren':'Missionen starten'} →</button>${p.progress?'<button class="btn secondary" onclick="replayLesson()">Übungen wiederholen</button>':''}</div></div><div class="panel"><h3>Ihr Stand</h3><p>${p.progress} von ${l.steps.length} Missionen abgeschlossen · ${p.passed?'Lernziel erreicht':p.attempts?'Bester Check: '+p.best+'/3':'Lernzielcheck noch offen'}</p><button class="btn secondary small" onclick="startCheck()">Abschlusscheck direkt öffnen</button><p class="hint">Nach einem echten Auftrag können Sie die Überprüfung auch unabhängig von den Missionen durchführen.</p></div>`;}
function activityView(l,p){const a=l.steps[step];if(a.type==='order'&&!order.length)order=a.items.map((_,i)=>i).reverse();return `<div class="row between"><div class="eyebrow">Lektion ${current} · Mission ${step+1} / ${l.steps.length}</div><button class="btn secondary small" onclick="go('home')">Pause & Übersicht</button></div><div class="progress" style="margin-bottom:25px"><i style="width:${step/l.steps.length*100}%"></i></div><div class="activity"><section class="panel" style="margin-top:0"><h2>${esc(a.title)}</h2>${quote(a)}${taskHTML(a,p)}${feedbackHTML()}<div class="actions"><button class="btn secondary small" onclick="previousStep()">← ${step?'Zurück':'Einstieg'}</button>${feedback?.ok?'<button class="btn" onclick="nextStep()">Weiter →</button>':`<button class="btn" id="submitAnswer" onclick="submitActivity()">${['form','reflect'].includes(a.type)?'Mit Beispiel vergleichen':'Antwort prüfen'}</button>`}</div></section><aside><div class="brief"><div class="eyebrow">Ihr Auftrag</div><p>${esc(l.goal)}</p><hr style="border:0;border-top:1px solid var(--line)"><p>📝 Bei eigenen Texten: Schreiben, vergleichen, überarbeiten.</p><p>💡 Bei Fragen dürfen Sie im Handbuch nachschlagen.</p><button class="btn secondary small" onclick="showHelp()">Handbuch zur Lektion</button></div></aside></div>`;}
function quote(a){return a.message?`<div class="quote"><div class="small"><span class="avatar">${esc(a.person?.slice(0,1)||'H')}</span><b>${esc(a.person)}</b></div><p>«${esc(a.message)}»</p></div>`:'';}
function fieldsFor(a){if(a.fields==='ticket')return [['title','Aussagekräftiger Titel',15],['who','Betroffene Person / Kontakt',6],['device','Gerät, Anwendung und Ort',10],['description','Beobachtung, Zeitpunkt und Umfang',45],['tests','Bisherige Schritte und Ergebnisse',20]];if(a.fields==='handover')return [['summary','Anliegen, Gerät und bisheriger Stand',50],['tests','Geprüfte Schritte und Ergebnisse',30],['next','Grund der Weitergabe und nächster Schritt',35]];if(a.fields==='closure')return [['solution','Massnahme und bestätigtes Ergebnis',50],['customer','Kurze Abschlussnachricht an die Person',35]];return [['text',a.fields==='explain'?'Erklären Sie eine einfache Prüfung in verständlichen Worten.':'Ihre freundliche Antwort und der nächste Schritt',60]];}
function draft(){return lp().drafts[step]??={};}
function taskHTML(a,p){if(a.type==='choice'||a.type==='multi')return `<p class="question">${esc(a.prompt)}</p>${a.type==='multi'?'<p class="hint">Mehrere Antworten möglich. Wählen Sie alle passenden Aussagen.</p>':''}${optionsHTML(a)}`;if(a.type==='reflect')return `<p class="question">${esc(a.prompt)}</p><label class="field" for="field-text">Ihre Überlegung</label><textarea id="field-text" oninput="setDraft('text',this.value)" maxlength="5000">${esc(draft().text||'')}</textarea><p class="hint">Mindestens 60 Zeichen. Diese eigene Antwort wird nicht automatisch fachlich bewertet.</p>${compareHTML(a)}`;if(a.type==='form')return `${fieldsFor(a).map(([k,label,min])=>`<label class="field" for="field-${k}">${esc(label)}</label><textarea id="field-${k}" oninput="setDraft('${k}',this.value)" maxlength="5000" style="min-height:${k==='title'||k==='who'?65:100}px">${esc(draft()[k]||'')}</textarea><div class="hint">Mindestens ${min} Zeichen · keine echten Personendaten.</div>`).join('')}${compareHTML(a)}`;if(a.type==='order')return `<p class="question">${esc(a.prompt)}</p>${order.map((id,i)=>`<div class="orderrow"><b>${i+1}</b><span>${esc(a.items[id])}</span><button aria-label="Schritt ${i+1} nach oben" onclick="moveOrder(${i},-1)" ${i===0?'disabled':''}>↑</button><button aria-label="Schritt ${i+1} nach unten" onclick="moveOrder(${i},1)" ${i===order.length-1?'disabled':''}>↓</button></div>`).join('')}`;if(a.type==='inspect')return `<p class="question">${esc(a.prompt)}</p><div class="inspector">${a.hotspots.map(([name],i)=>`<button class="hotspot ${opened.includes(i)?'seen':''}" onclick="inspect(${i})">${opened.includes(i)?'✓ ': '⌕ '}${esc(name)}</button>`).join('')}</div>${opened.map(i=>`<div class="evidence"><b>${esc(a.hotspots[i][0])}:</b> ${esc(a.hotspots[i][1])}</div>`).join('')}<p class="hint">${opened.length} / ${a.hotspots.length} Hinweise untersucht</p>${opened.length===a.hotspots.length?optionsHTML(a):''}`;return '';}
function compareHTML(a){if(!draft().compared)return '';const sample=a.type==='reflect'?a.example:sampleFor(a);return `<div class="notice"><b>Vergleichen Sie selbst</b><p>${esc(sample)}</p><label><input type="checkbox" ${draft().confirmed?'checked':''} onchange="setDraft('confirmed',this.checked)"> Ich habe meine Antwort mit dem Beispiel verglichen und bei Bedarf verbessert.</label><p class="hint">Dies ist eine Selbstkontrolle, keine automatische Bewertung Ihres Textes.</p></div>`;}
function sampleFor(a){if(a.fields==='ticket'){if(current===3)return 'Beispiel: Zimmer 204: Beamer zeigt «Kein Signal». Frau Keller, Kontakt über Schul-Teams. Laptop BWS-08; Laptopbildschirm funktioniert. Seit 10 Uhr kein Beamerbild. HDMI-Verbindungen an beiden Enden geprüft; Meldung bleibt. Ursache noch offen.';return 'Beispiel: BWS-09 / Zimmer 105: Drucker EG wird als offline angezeigt. Herr Frei, Kontakt über Schul-Teams. Seit 08:00 Uhr kein Ausdruck; andere Personen können dort drucken. Noch keine Massnahmen durchgeführt. Ursache offen.';}if(a.fields==='handover')return a.why+' Beispiel einer Struktur: Gerät/Ort – konkrete Beobachtung – seit wann und wen es betrifft – Prüfschritt mit Ergebnis – was noch offen ist – zuständige Stelle und Rückmeldung an die Person.';if(a.fields==='closure')return 'Beispiel: Das Lernvideo war im Videoplayer stummgeschaltet. Stummschaltung nach Rücksprache aufgehoben. Aylin bestätigt, dass der Ton wieder funktioniert. Nachricht: «Der Ton ist wieder da. Die Stummschaltung im Videoplayer war aktiv. Falls es erneut passiert, können Sie dort zuerst nachsehen.»';if(a.fields==='explain')return 'Beispiel: «Bitte schauen Sie unten am Bildschirm auf das Lautsprechersymbol. Ist es durchgestrichen? Sagen Sie mir bitte, was Sie sehen, bevor wir etwas ändern.»';return 'Beispiel: «Für einen neuen Schülerausweis ist bei uns das Sekretariat zuständig. Ich zeige Ihnen gern, wo Sie es finden beziehungsweise wie Sie Kontakt aufnehmen können.»';}
function optionsHTML(a){return `<div class="options" role="group" aria-label="Antwortmöglichkeiten">${a.options.map((o,i)=>`<button class="option ${selected.includes(i)?'selected':''}" aria-pressed="${selected.includes(i)}" onclick="choose(${i})"><span class="marker">${selected.includes(i)?'✓':String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div>`;}
function choose(i){const a=screen==='check'?lessons[current-1].check[checkIndex]:lessons[current-1].steps[step];if(feedback?.ok)return;if(a.type==='multi'){selected=selected.includes(i)?selected.filter(n=>n!==i):[...selected,i];}else selected=[i];feedback=null;render();}
function setDraft(k,v){draft()[k]=v;save();}
function inspect(i){if(!opened.includes(i))opened.push(i);feedback=null;render();}
function moveOrder(i,d){[order[i],order[i+d]]=[order[i+d],order[i]];feedback=null;render();}
function isCorrect(a,sel){return JSON.stringify([...sel].sort())===JSON.stringify((Array.isArray(a.correct)?[...a.correct]:[a.correct]).sort());}
function feedbackHTML(){return feedback?`<div class="feedback ${feedback.ok?'':'wrong'}" role="status"><strong>${feedback.ok?'Gut nachvollzogen.':'Schauen Sie nochmals hin.'}</strong><p>${esc(feedback.text)}</p></div>`:'';}
function submitActivity(){const a=lessons[current-1].steps[step];if(['reflect','form'].includes(a.type)){const fs=a.type==='reflect'?[['text','',60]]:fieldsFor(a);if(fs.some(([k,,min])=>String(draft()[k]||'').trim().length<min)){toast('Bitte ergänzen Sie Ihre Antwort. Die Mindestlängen stehen bei den Feldern.');return;}if(!draft().compared){draft().compared=true;save();render();return;}if(!draft().confirmed){toast('Vergleichen Sie Ihre Antwort und bestätigen Sie anschliessend die Selbstkontrolle.');return;}feedback={ok:true,text:'Selbstkontrolle abgeschlossen. Ihre eigene Antwort bleibt gespeichert. Besprechen Sie offene Fragen mit Ihrer Lehrperson.'};}else{if(a.type==='inspect'&&opened.length<a.hotspots.length){toast('Untersuchen Sie zuerst alle Hinweise.');return;}if(a.type!=='order'&&!selected.length){toast('Wählen Sie zuerst eine Antwort.');return;}let ok=a.type==='order'?order.every((n,i)=>n===i):isCorrect(a,selected);feedback={ok,text:a.why};}render();}
function nextStep(){const p=lp();p.progress=Math.max(p.progress,step+1);p.reviewed??={};p.reviewed[step]=true;save();if(step+1>=lessons[current-1].steps.length){startCheck();return;}step++;resetActivity();render();focusMain();}
function previousStep(){if(step===0)screen='intro';else step--;resetActivity();render();focusMain();}
function startCheck(){const p=lp();screen=p.checkAnswers.length>=3?'result':'check';checkIndex=p.checkAnswers.length;resetActivity();save();render();focusMain();}
function checkView(l,p){const a=l.check[checkIndex];return `<div class="row between"><span class="checklabel">Lernzielcheck · ${checkIndex+1} / 3</span><button class="btn secondary small" onclick="go('home')">Pause</button></div><h1 style="margin-top:25px">Zeigen Sie, was Sie können.</h1><p class="muted">Ein neuer Fall. Die Rückmeldung erscheint nach allen drei Aufgaben. Zwei richtige Antworten reichen zum Bestehen.</p><div class="panel"><h2>${esc(a.title)}</h2>${quote(a)}<p class="question">${esc(a.prompt)}</p>${a.type==='multi'?'<p class="hint">Mehrere Antworten möglich. Alle passenden Aussagen auswählen.</p>':''}${optionsHTML(a)}<div class="actions"><span class="small muted">Ihre Antworten werden gespeichert.</span><button class="btn" onclick="submitCheck()">${checkIndex===2?'Check abschliessen':'Antwort abgeben →'}</button></div></div>`;}
function submitCheck(){if(!selected.length){toast('Wählen Sie eine Antwort.');return;}const p=lp(),a=lessons[current-1].check[checkIndex];p.checkAnswers.push({selected:[...selected],correct:isCorrect(a,selected)});selected=[];checkIndex++;if(checkIndex>=3){const n=p.checkAnswers.filter(a=>a.correct).length;p.attempts++;p.best=Math.max(p.best,n);p.passed=p.passed||n>=2;p.completed=true;screen='result';}save();render();focusMain();}
function resultView(l,p){const n=p.checkAnswers.filter(a=>a.correct).length;return `<div class="eyebrow">Lektion ${current} · Lernzielcheck</div><h1>${n>=2?'Gut gemacht.':'Weiter üben lohnt sich.'}</h1><div class="panel"><div class="row between"><h2 style="margin:0">${n} von 3 Aufgaben richtig</h2><span class="pill">${n>=2?'Lernziel erreicht':'Lernziel noch üben'}</span></div><p style="margin-top:15px">${n>=2?'Schauen Sie auch die Rückmeldungen an. Begründen Sie Ihrer Lehrperson eine Ihrer Entscheidungen.':'Lesen Sie die Erklärungen und üben Sie die passenden Missionen erneut. Anschliessend können Sie den Check wiederholen.'}</p><p class="hint">Auswahlaufgaben werden automatisch ausgewertet. Eigene Texte wurden mit einer Selbstkontrolle bearbeitet. Ein bestandener Check belegt keine vollständige praktische Beherrschung.</p></div>${l.check.map((a,i)=>{const ans=p.checkAnswers[i];return `<div class="panel"><span class="pill">${ans?.correct?'✓ Richtig':'↻ Noch üben'}</span><h3 style="margin-top:12px">${esc(a.title)}</h3><p>${esc(a.prompt)}</p><p class="small"><b>Ihre Antwort:</b> ${(ans?.selected||[]).map(n=>esc(a.options[n])).join(' · ')}</p><p class="small"><b>Passende Antwort:</b> ${(Array.isArray(a.correct)?a.correct:[a.correct]).map(n=>esc(a.options[n])).join(' · ')}</p><div class="notice">${esc(a.why)}</div></div>`}).join('')}<div class="row"><button class="btn" onclick="${current<5?'openLesson('+(current+1)+')':"go('home')"}">${current<5?'Zur nächsten Lektion →':'Zur Übersicht →'}</button><button class="btn secondary" onclick="retryCheck()">Check wiederholen</button><button class="btn secondary" onclick="replayLesson()">Missionen erneut üben</button><button class="btn secondary" onclick="exportReport()">↓ Lernbericht</button></div><div class="notice">Jetzt kurz gemeinsam zurückblicken: Was möchten Sie beim nächsten echten Helpdesk-Auftrag anwenden?</div>`;}
function retryCheck(){lp().checkAnswers=[];save();startCheck();}
function handbook(){return `<div class="eyebrow">Ihr Werkzeugkasten</div><h1>Nachschlagen. Weiterkommen.</h1><p class="muted">Die ersten drei Einträge brauchen Sie bereits im Einstieg. Die weiteren Begriffe sind ein Ausblick auf spätere Modulcluster.</p><div class="glossary">${glossary.map(([t,d],i)=>`<details><summary>${esc(t)} ${i>2?'<span class="pill">Ausblick</span>':''}</summary><p>${esc(d)}</p></details>`).join('')}</div><div class="panel"><h2>Ihr Spielstand</h2><p>Der Fortschritt liegt in diesem Browserprofil auf diesem Gerät. Privates Surfen, das Löschen von Websitedaten oder automatische Bereinigungen der Schulgeräte können ihn entfernen. Sichern Sie ihn deshalb regelmässig als Datei.</p><div class="row"><button class="btn" onclick="exportSave()">↓ Spielstand sichern</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">↑ Spielstand laden</button><button class="btn secondary" onclick="exportReport()">↓ Lernbericht</button></div><p class="hint">Eine Sicherung enthält auch Ihre geschriebenen Antworten. Speichern Sie sie im persönlichen Schulordner. Sie wird nicht automatisch auf andere Geräte übertragen.</p></div><div class="panel"><h2>Für die Lehrperson</h2><p>Fünf Lektionen mit je ca. 30 Minuten als Richtwert: Einstieg, geführte Missionen, eigene Anwendung und drei Abschlussaufgaben. Echte Aufträge haben Vorrang. Alle Lektionen und Checks sind direkt erreichbar.</p><p>Die Fälle verwenden fiktive Schulregeln. Klären Sie vor dem Einsatz die tatsächlichen Zuständigkeiten und erlaubten Handlungen. Die Inhalte dieses Prototyps folgen der gemeinsam erarbeiteten Planung; ein vollständiger Abgleich mit den hochgeladenen Unterrichtsunterlagen steht noch aus.</p><p>Die Checks gelten ab 2 von 3 richtigen Aufgaben als bestanden. Wiederholungen verwenden dieselben Aufgaben. Der Lernbericht unterscheidet Versuche, bestes Ergebnis und aktuelle Antworten. Eigene Texte werden fachlich nicht automatisch bewertet.</p><p>Die Spielzeit hängt von Lesetempo, eigener Textarbeit und Austausch ab. Prüfen Sie die 30-Minuten-Planung beim ersten Einsatz und kürzen oder ergänzen Sie nach Bedarf.</p><div class="row"><button class="btn secondary" onclick="downloadOffline()">↓ Offline-Spiel herunterladen</button><button class="btn secondary" onclick="resetAll()">Spielstand zurücksetzen</button></div></div><p class="footerline">Version 1.0 · Cluster 1. Weitere Cluster sind noch nicht enthalten. Erfahrungspunkte: 10 pro abgeschlossener Mission und einmalig 30 pro bestandenem Check.</p>`;}
function showHelp(){const l=lessons[current-1];const dialog=document.getElementById('confirmDialog');document.getElementById('dialogTitle').textContent='Kurz nachschlagen';document.getElementById('dialogText').textContent=l.brief;document.getElementById('dialogYes').textContent='Zurück zur Mission';document.getElementById('dialogYes').onclick=()=>dialog.close();dialog.showModal();}
function confirmAction(title,text,fn){const d=document.getElementById('confirmDialog');document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogText').textContent=text;document.getElementById('dialogYes').textContent='Bestätigen';document.getElementById('dialogYes').onclick=()=>{d.close();fn();};d.showModal();}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function exportSave(){save();download('Helpdesk-Spielstand-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json');toast('Spielstand heruntergeladen. Im persönlichen Schulordner aufbewahren.');}
function exportReport(){const lines=['HELPDESK – LERNBERICHT','Cluster 1 · '+new Date().toLocaleString('de-CH'),'','Eigene Texte: Selbstkontrolle, keine automatische Fachbewertung.',''];lessons.forEach(l=>{const p=state.lessons[l.id];lines.push('LEKTION '+l.id+': '+l.title,l.goal,'Missionen: '+(p?.progress||0)+'/8','Checkversuche: '+(p?.attempts||0)+' · Bestes Ergebnis: '+(p?.best||0)+'/3 · '+(p?.passed?'Lernziel erreicht':'noch offen / üben'));if(p){l.steps.forEach((a,i)=>{const d=p.drafts[i];if(d){lines.push('\nMission '+(i+1)+': '+a.title);Object.entries(d).filter(([k,v])=>typeof v==='string').forEach(([k,v])=>lines.push(k+': '+v));lines.push('Selbstkontrolle bestätigt: '+(d.confirmed?'ja':'nein'));}});p.checkAnswers.forEach((ans,i)=>lines.push('Check '+(i+1)+': '+ans.selected.map(n=>l.check[i].options[n]).join(' / ')));}lines.push('\n');});download('Helpdesk-Lernbericht.txt',lines.join('\n'),'text/plain;charset=utf-8');}
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>2000000){toast('Die Datei ist zu gross. Bitte einen Helpdesk-Spielstand wählen.');return;}try{const incoming=JSON.parse(await f.text());if(!valid(incoming))throw Error('invalid');confirmAction('Spielstand laden?','Der aktuelle Browser-Spielstand wird durch diese Sicherung ersetzt. Sichern Sie Ihren bisherigen Stand bei Bedarf zuerst.',()=>{state=incoming;save();go('home');toast('Spielstand geladen.');});}catch(err){toast('Diese Datei ist kein gültiger Spielstand dieser Spielversion. Ihr bisheriger Stand bleibt erhalten.');}});
function resetAll(){confirmAction('Gesamten Spielstand zurücksetzen?','Alle Fortschritte und eigenen Antworten in diesem Browser werden entfernt. Eine heruntergeladene Sicherung bleibt erhalten.',()=>{state=fresh();save();go('home');});}
async function downloadOffline(){if(window.HELPDESK_OFFLINE){download('Helpdesk-Erste-Schicht.html','<!doctype html>'+document.documentElement.outerHTML,'text/html;charset=utf-8');return;}try{const [c,a]=await Promise.all([fetch('content.js').then(r=>{if(!r.ok)throw Error();return r.text();}),fetch('app.js').then(r=>{if(!r.ok)throw Error();return r.text();})]);let h='<!doctype html>'+document.documentElement.outerHTML;h=h.replace(/<script src="content.js"><\/script>/,'<script>'+c.replace(/<\/script/gi,'<\\/script')+'<\/script>').replace(/<script src="app.js"><\/script>/,'<script>'+a.replace(/<\/script/gi,'<\\/script')+'<\/script>');download('Helpdesk-Erste-Schicht.html',h,'text/html;charset=utf-8');toast('Offline-Spiel heruntergeladen. Spielstände bei einem Wechsel separat übertragen.');}catch(e){toast('Der Download ist hier nicht verfügbar. Nutzen Sie die bereitgestellte HTML-Datei.');}}
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){toast('Der Spielstand wurde in einem anderen Tab geändert. Bitte nur in einem Tab arbeiten.');}});
saveLabel();render();
</script></body></html>
