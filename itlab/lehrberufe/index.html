r(--muted);font-size:18px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:22px}.dark{background:var(--ink);color:white;border-color:var(--ink)}.dark .eyebrow,.dark .muted{color:#c4d0e2}.dark h2{font-size:30px}.dark a{color:var(--lime)}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:11px 18px;font-weight:700;text-decoration:none;display:inline-block;font-size:15px}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.dark .btn.primary{background:var(--lime);color:var(--ink);border:0}.btn:hover{filter:brightness(.95)}.muted{color:var(--muted)}.small{font-size:14px}.tag{display:inline-block;background:#ecf1f8;border-radius:6px;padding:3px 9px;font-size:13px;font-weight:700}.dark .tag{color:var(--ink);background:var(--lime)}.badge{font:700 28px monospace;letter-spacing:-2px;margin-bottom:23px;color:var(--blue)}.card{display:flex;flex-direction:column;align-items:start}.card p{flex:1}.card h3{min-height:52px}.card .btn{margin-top:10px}.progress{height:7px;background:#dce4ee;border-radius:7px;overflow:hidden;margin:12px 0}.progress i{height:100%;display:block;background:var(--blue)}.asidefoot{margin-top:40px;font-size:14px;color:var(--muted)}.goals{padding-left:20px}.goals li{margin:10px 0}.question{padding:22px 0;border-bottom:1px solid var(--line)}.question:last-child{border-bottom:0}.question legend{font-weight:750;margin-bottom:12px}.question fieldset{border:0;padding:0;margin:0;min-width:0}.options{display:grid;gap:9px}.option{display:flex;gap:11px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff;cursor:pointer}.option:has(input:checked){background:#edf3f 'use strict';
const KEY='ict-berufslabor-v1';let S={interests:{},answers:{},notes:{},visits:[],finalDone:false};try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.interests&&x.answers&&x.notes&&Array.isArray(x.visits))S=x}catch(e){}let storageOK=true;
const jobs=[
{id:'media',code:'01',name:'Mediamatiker/in EFZ',short:'Mediamatik',years:4,slug:'mediamatiker-in-efz',title:'Mach die Eröffnung sichtbar.',focus:'Inhalte, Gestaltung & Kommunikation',result:'Ein kurzes Video und eine verständliche Veranstaltungsseite.',about:'Du verbindest Gestaltung, Kommunikation und Technik: etwa Videos planen und schneiden, Webseiten pflegen und Inhalte für eine Zielgruppe aufbereiten. Marketing und Projektorganisation gehören dazu.',boundary:'Gemeinsam mit der Applikationsentwicklung arbeitest du an digitalen Angeboten. Dein Schwerpunkt liegt auf verständlichen Inhalten und Gestaltung; die Applikationsentwicklung programmiert beispielsweise die Buchungslogik.',interest:['Ich möchte aus Bildern, Text und Ton eine verständliche Geschichte machen.','Ich möchte herausfinden, welche Gestaltung eine bestimmte Zielgruppe anspricht.'],case:'Das Jugendzentrum «Dock» eröffnet in drei Wochen. Jugendliche sehen die bisherigen Plakate, wissen aber nicht, was sie vor Ort machen können. Dein Auftrag: einen 20-Sekunden-Clip für 14- bis 18-Jährige planen.',artifact:'Briefing: Smartphone · auch ohne Ton verständlich · Datum und Ort müssen erkennbar sein · Budget CHF 150.',q:[['Welcher Entwurf erfüllt den Auftrag am besten?',['Eine lange Begrüssungsrede ohne Untertitel.','Kurze Szenen von Angeboten, Untertitel und ein klarer Hinweis auf Datum und Ort.','Nur ein schönes Logo ohne weitere Angaben.'],1,'Der Clip zeigt den Nutzen für die Zielgruppe und funktioniert ohne Ton. Gestaltung muss zum Kommunikationsziel passen.'],['Im Clip ist eine Besucherin gut erkennbar. Was gehört vor die Veröffentlichung?',['Die Zustimmung zur Verwendung der Aufnahme klären und auch Musikrechte prüfen.','Einfach hochladen, weil das Jugendzentrum gemeinnützig ist.','Nur die Bildqualität prüfen.'],0,'Bild- und Nutzungsrechte gehören zur Medienproduktion. Technische Qualität allein genügt nicht.']],challenge:'Ein Clip wird oft angesehen, aber kaum jemand meldet sich an. Nenne zwei mögliche Ursachen und einen Test.',model:'Zum Beispiel: Der Anmeldelink ist schwer zu finden oder das Angebot wird unklar erklärt. Zwei Varianten mit klarer Handlungsaufforderung vergleichen und nicht nur Aufrufe, sondern Anmeldungen beobachten.'},
{id:'business',code:'02',name:'Entwickler/in digitales Business EFZ',short:'Digitales Business',years:4,slug:'entwickler-in-digitales-business-efz',title:'Mach aus Chaos einen Ablauf.',focus:'Prozesse, Daten & Zusammenarbeit',result:'Ein verbesserter Buchungsablauf mit messbarem Nutzen.',about:'Du untersuchst Abläufe und Daten, sammelst Bedürfnisse und entwickelst Verbesserungsvorschläge. Du koordinierst die Umsetzung digitaler Lösungen und prüfst, ob sie im Alltag helfen.',boundary:'Wie die Applikationsentwicklung arbeitest du an digitalen Lösungen. Du klärst vor allem, welches Problem gelöst werden soll und welchen Nutzen die Lösung bringt. Programmieren ist nicht der Hauptschwerpunkt; technische Werkzeuge können trotzdem dazugehören.',interest:['Ich möchte herausfinden, warum ein Ablauf unnötig lange dauert.','Ich möchte Menschen befragen und mit Daten eine Verbesserung begründen.'],case:'Raumbuchungen kommen per E-Mail, Telefon und Zettel. Die Leitung überträgt sie in eine Liste. Oft fehlen Angaben. Du sollst den Prozess verbessern, bevor das Team eine neue App entwickelt.',artifact:'Beobachtung in einer Woche: 40 Anfragen · 12 mit Rückfragen · 5 Minuten Aufwand je Rückfrage. Alle Zahlen sind für diesen Übungsfall erfunden.',q:[['Was tust du zuerst?',['Sofort eine App bestellen.','Alle Anfragen nur noch telefonisch akzeptieren.','Den Ablauf beobachten, Beteiligte befragen und häufig fehlende Angaben ermitteln.'],2,'Erst das Problem verstehen: Ein neues Werkzeug allein macht einen schlechten Ablauf nicht automatisch besser.'],['Ein neues Formular senkt die Rückfragen von 12 auf 4 pro Woche. Bei 5 Minuten je Rückfrage: Was ist eine sinnvolle Auswertung?',['Es spart 40 Minuten Rückfrageaufwand pro Woche; zusätzlich die Bedienbarkeit prüfen.','Es spart 60 Minuten, weil vorher 12 Rückfragen vorkamen.','Die Farbe des Formulars beweist den Erfolg.'],0,'8 vermiedene Rückfragen × 5 Minuten = 40 Minuten. Für eine Gesamtbewertung fehlen weitere Kosten und Rückmeldungen der Nutzenden.']],challenge:'Wen würdest du vor der Einführung befragen, und welche zwei Kennzahlen würdest du danach vergleichen?',model:'Etwa Jugendliche, Empfang und Leitung. Vorher/nachher: Rückfragen pro Buchung und Bearbeitungszeit. Auch Zufriedenheit und mögliche Hürden für Menschen ohne Smartphone beachten.'},
{id:'building',code:'03',name:'Gebäudeinformatiker/in EFZ',short:'Gebäudeinformatik',years:4,slug:'gebaeudeinformatiker-in-efz',title:'Bring dem Gebäude Regeln bei.',focus:'Gebäudesysteme & Vernetzung',result:'Eine getestete Steuerung für Licht und Lüftung.',about:'Du planst und vernetzt Systeme im Gebäude. Je nach Fachrichtung stehen Gebäudeautomation, Kommunikation und Multimedia oder Planung im Zentrum. Dazu gehören Konfiguration, Tests und Dokumentation.',boundary:'Mit der Plattformentwicklung teilst du Netzwerkthemen. Hier stehen Gebäudefunktionen wie Licht, Lüftung und Multimedia im Mittelpunkt. Die drei Fachrichtungen unterscheiden sich; unser Fall zeigt Gebäudeautomation.',interest:['Ich möchte verstehen, wie Sensoren, Licht und Lüftung zusammenarbeiten.','Ich möchte technische Systeme vor Ort einstellen und systematisch testen.'],case:'Im Workshopraum brennt das Licht auch tagsüber ohne Bedarf. Im neuen System meldet ein Sensor, ob jemand da ist und ob es dunkel ist. Deine Aufgabe: eine passende Lichtregel testen.',artifact:'Vereinfachtes Modell: Licht soll nur dann an sein, wenn jemand im Raum ist UND es dunkel ist. In echten Anlagen kommen etwa Zeitverzögerungen und manuelle Bedienung dazu.',q:[['Der Raum ist leer und dunkel. Was muss die Regel bewirken?',['Licht an, weil es dunkel ist.','Licht aus, weil niemand anwesend ist.','Die Buchungs-App löschen.'],1,'Bei UND müssen beide Bedingungen erfüllt sein. Die Anwesenheit fehlt.'],['Welche Prüfung ist vor der Übergabe besonders sinnvoll?',['Nur testen, ob das Licht einmal angeht.','Die Farbe des Sensors beurteilen.','Alle vier Kombinationen von Anwesenheit und Helligkeit testen und dokumentieren.'],2,'Eine systematische Prüfung untersucht auch Fälle, in denen das Licht aus bleiben muss.']],challenge:'Warum genügt unser Modell für einen echten Workshopraum noch nicht? Nenne zwei Ergänzungen.',model:'Zum Beispiel eine Nachlaufzeit, damit das Licht bei wenig Bewegung nicht sofort ausgeht, sowie manuelle Bedienung und ein definiertes Verhalten bei Sensorausfall. Anforderungen mit der Kundschaft klären.'},
{id:'app',code:'04',name:'Informatiker/in EFZ · Applikationsentwicklung',short:'Applikationsentwicklung',years:4,slug:'informatiker-in-efz',title:'Baue die Buchungsfunktion.',focus:'Software, Logik & Tests',result:'Eine funktionierende und geprüfte Buchungsfunktion.',about:'Du entwickelst Software: Anforderungen verstehen, Lösungen entwerfen, programmieren und testen. Auch Pflege, Dokumentation und die Zusammenarbeit mit Nutzenden und anderen Fachpersonen gehören dazu.',boundary:'Beide Informatik-Fachrichtungen brauchen Logik, technische Grundlagen und Teamarbeit. Hier liegt der Schwerpunkt auf Softwarefunktionen. Plattformentwicklung sorgt schwerpunktmässig für die technische Betriebsumgebung.',interest:['Ich möchte eine Idee in eine funktionierende App umsetzen.','Ich möchte einen Fehler in einer Schritt-für-Schritt-Logik aufspüren.'],case:'Für einen Workshop gibt es 12 Plätze. Die Buchungsfunktion darf eine Anmeldung nur annehmen, wenn noch ein Platz frei ist. Du untersuchst eine fehlerhafte Regel.',artifact:'Fehlerhafter Entwurf: «Wenn gebuchte Plätze kleiner ODER GLEICH 12 sind, nimm eine weitere Buchung an.»',q:[['Bei welchem Stand zeigt sich der Fehler?',['Bei 0 Buchungen.','Bei 11 Buchungen.','Bei genau 12 Buchungen: Eine 13. wird zugelassen.'],2,'Kleiner oder gleich lässt auch den bereits vollen Workshop durch. Für eine weitere Buchung muss die Zahl kleiner als 12 sein.'],['Welche Testreihe prüft die Grenze am sinnvollsten?',['11, 12 und 13 bereits gebuchte Plätze.','Nur 1 bereits gebuchter Platz.','Nur prüfen, ob die Schaltfläche schön aussieht.'],0,'Grenzfälle zeigen, ob die Regel bei fast vollem, vollem und ungültig überfülltem Workshop korrekt reagiert.']],challenge:'Zwei Personen buchen den letzten Platz gleichzeitig. Weshalb genügt eine Prüfung im Browser nicht?',model:'Beide Browser könnten denselben alten Stand sehen. Der Server muss Prüfung und Buchung zuverlässig zusammen ausführen, damit der Platz nicht doppelt vergeben wird.'},
{id:'platform',code:'05',name:'Informatiker/in EFZ · Plattformentwicklung',short:'Plattformentwicklung',years:4,slug:'informatiker-in-efz',title:'Halte das Dock online.',focus:'Netzwerke, Server & Betrieb',result:'Eine verfügbare, abgesicherte Betriebsumgebung.',about:'Du baust und betreibst ICT-Infrastruktur wie Netzwerke, Server und Cloud-Dienste. Du automatisierst Abläufe, überwachst Systeme und arbeitest an Sicherheit und Verfügbarkeit.',boundary:'Mit ICT-Fachleuten teilst du Fehlersuche und den Umgang mit Geräten und Netzen. Dein Schwerpunkt liegt stärker auf Aufbau und Betrieb der Infrastruktur. Applikationsentwicklung programmiert vor allem die Software, die darauf läuft.',interest:['Ich möchte verstehen, wie Geräte, Netzwerke und Server zusammenspielen.','Ich möchte Systeme zuverlässig betreiben und wiederkehrende Aufgaben automatisieren.'],case:'Die Buchungs-App läuft auf einem Server. Bei dessen Ausfall können keine Buchungen erfolgen. Ausserdem darf das öffentliche Gäste-WLAN keinen Zugriff auf interne Verwaltungsdaten erhalten.',artifact:'Betriebsauftrag: Gästezugang trennen · Berechtigungen passend vergeben · Ausfälle erkennen · Wiederherstellung testen.',q:[['Wie schützt du die internen Systeme am sinnvollsten?',['Allen Gästen das Administrationspasswort geben.','Gäste- und internes Netz trennen und nur nötige Verbindungen zulassen.','Den WLAN-Namen länger machen.'],1,'Netztrennung und eingeschränkte Zugriffe reduzieren unerwünschte Verbindungen. Ein anderer Name allein schützt keine Daten.'],['Eine Sicherung wurde jede Nacht erstellt. Woran erkennst du, ob sie im Notfall hilft?',['Am schönen Dateinamen.','Daran, dass sie auf demselben defekten Datenträger liegt.','Durch eine kontrollierte Wiederherstellung und Prüfung der Daten.'],2,'Ein Backup ist erst dann belastbar, wenn die Wiederherstellung funktioniert. Verfügbarkeit und Datensicherung sind unterschiedliche Aufgaben.']],challenge:'Erkläre den Unterschied zwischen einer Ersatzinstanz und einem Backup mit einem Beispiel.',model:'Eine Ersatzinstanz kann den laufenden Betrieb bei einem Ausfall übernehmen. Ein Backup hilft, frühere Datenstände wiederherzustellen, etwa nach versehentlichem Löschen. Eine Ersatzinstanz kann die Löschung ebenfalls übernehmen und ersetzt kein Backup.'},
{id:'support',code:'06',name:'ICT-Fachmann/-frau EFZ',short:'ICT-Fachmann/-frau',years:3,slug:'ict-fachmann-frau-efz',title:'Hilf einem Menschen weiter.',focus:'Geräte, Support & Anwenderfragen',result:'Ein einsatzbereiter Arbeitsplatz und eine verständliche Anleitung.',about:'Du richtest Geräte und Anwendungen ein, unterstützt Anwenderinnen und Anwender und grenzt Störungen ein. Du erklärst Lösungen, dokumentierst Probleme und leitest komplexe Fälle an zuständige Fachpersonen weiter.',boundary:'Mit der Plattformentwicklung teilst du technische Grundlagen und Fehlersuche. Dein Schwerpunkt liegt näher am Arbeitsplatz und den Menschen, die ihn nutzen. Die dreijährige Lehre ist ein eigenständiger Beruf.',interest:['Ich möchte jemandem geduldig helfen, ein technisches Problem zu lösen.','Ich möchte Geräte einrichten und Schritt für Schritt die Ursache einer Störung finden.'],case:'Am Empfang sagt Sam: «Das Internet geht nicht.» Andere Mitarbeitende können normal arbeiten. Sam muss gleich die Teilnehmendenliste öffnen. Du übernimmst das Supportgespräch.',artifact:'Ticket: ein Laptop betroffen · seit heute Morgen · keine weiteren Angaben · andere Arbeitsplätze funktionieren.',q:[['Welcher erste Schritt hilft am meisten?',['Das gesamte Netzwerk sofort neu starten.','Sam fragen, was genau nicht funktioniert, und Verbindung sowie Fehlermeldung prüfen.','Ohne Rückfrage das Gerät vollständig zurücksetzen.'],1,'Eine genaue Beschreibung und einfache Prüfungen grenzen die Ursache ein. So vermeidest du unnötige Eingriffe und Datenverlust.'],['Du kannst die Ursache nicht selbst lösen. Was gibst du an das zuständige Team weiter?',['Fehlermeldung, betroffene Geräte, Zeitpunkt und bereits durchgeführte Prüfungen.','Nur «geht nicht».','Sams Passwort im Klartext.'],0,'Eine strukturierte Übergabe hilft bei der weiteren Analyse. Passwörter gehören nicht in ein Ticket.']],challenge:'Formuliere für Sam eine freundliche Rückmeldung, wenn die Störung noch nicht gelöst ist.',model:'Zum Beispiel: «Ich habe die Verbindung geprüft. Die Anwendung meldet weiterhin einen Fehler. Ich gebe den Fall mit unseren Testergebnissen weiter. Bis dahin prüfen wir einen freigegebenen Ersatzarbeitsplatz. Ich informiere dich über den nächsten Stand.»'}
];
const pre=[['Die Buchungs-App öffnet sich, berechnet aber eine falsche Teilnehmerzahl. Wer untersucht hauptsächlich die Programmlogik?',['Applikationsentwicklung','Mediamatik','Gebäudeinformatik'],0,'Applikationsentwicklung untersucht die Softwarelogik. Andere Fachpersonen können bei der Fehlereingrenzung helfen.'],['Was ist ein Prozess?',['Ein Bildschirmtyp.','Ein zusammenhängender Ablauf von Arbeitsschritten.','Ein Passwort.'],1,'Ein Buchungsprozess kann von der Anfrage über die Bestätigung bis zur Teilnahme reichen.'],['Was ist ein Backup?',['Eine zusätzliche Bildschirmansicht.','Ein schnelleres WLAN.','Eine Sicherung, aus der sich Daten wiederherstellen lassen.'],2,'Sichern und Wiederherstellen gehören zusammen.'],['Was ist eine Zielgruppe?',['Die Menschen, für die ein Angebot gedacht ist.','Alle Server im selben Raum.','Ein Programmierbefehl.'],0,'Wer die Zielgruppe kennt, kann Inhalt und Gestaltung passend planen.'],['Ein Sensor liefert Werte über die Helligkeit. Was kann eine Steuerung damit tun?',['Automatisch alle Probleme lösen.','Anhand einer Regel das Licht schalten.','Eine Werbekampagne entwerfen.'],1,'Ein Sensor misst, eine Regel entscheidet und ein angeschlossenes System führt die Aktion aus.'],['Jemand meldet eine Störung. Was ist für die Fehlersuche hilfreich?',['Möglichst viele Einstellungen auf einmal ändern.','Nichts dokumentieren.','Das Problem genau erfassen und jeweils eine Vermutung prüfen.'],2,'Systematische Schritte machen die Ursache nachvollziehbar.']];
const finalQ=[['Die neue Buchungsseite funktioniert, aber Jugendliche verstehen das Angebot nicht. Wer übernimmt hauptsächlich die verständliche Gestaltung?',['Mediamatik','Plattformentwicklung','ICT-Fachmann/-frau'],0,'Mediamatik arbeitet an Inhalt, Darstellung und Kommunikation.'],['Der Vereinsvorstand weiss nicht, an welcher Stelle eine Anmeldung stockt. Wer untersucht den Ablauf und die Daten?',['Gebäudeinformatik','Digitales Business','Plattformentwicklung'],1,'Digitales Business analysiert Abläufe und erarbeitet Verbesserungen.'],['Die Lüftung soll auf Messwerte reagieren. Wo liegt der Schwerpunkt?',['Mediamatik','ICT-Fachmann/-frau','Gebäudeinformatik'],2,'Gebäudeautomation verknüpft Gebäudesysteme mit Sensorwerten und Regeln.'],['Die Stornierungsfunktion gibt einen falschen Betrag zurück. Wer bearbeitet den Softwarefehler?',['Applikationsentwicklung','Digitales Business','Gebäudeinformatik'],0,'Die Programmlogik ist der Schwerpunkt der Applikationsentwicklung.'],['Ein Verein braucht eine abgesicherte Serverumgebung mit Überwachung. Wer übernimmt hauptsächlich?',['Mediamatik','Plattformentwicklung','Digitales Business'],1,'Plattformentwicklung baut und betreibt solche technischen Umgebungen.'],['Ein neuer Mitarbeiter braucht ein eingerichtetes Notebook und eine Einführung. Wer passt besonders gut?',['Gebäudeinformatik','Mediamatik','ICT-Fachmann/-frau'],2,'Geräte, Anwendungen und Unterstützung am Arbeitsplatz gehören zum Schwerpunkt dieses Berufs.'],['Welche Aussage zu den Berufen stimmt?',['Nur Mediamatik braucht Kreativität.','Alle arbeiten ausschliesslich allein.','Alle brauchen Kommunikation, sorgfältiges Arbeiten und die Bereitschaft, Neues zu lernen.'],2,'Kreativität, Teamarbeit und Lernbereitschaft sind berufsübergreifend wichtig.'],['Welche Aussage zur Ausbildung stimmt?',['ICT-Fachmann/-frau dauert regulär 3 Jahre; die anderen hier vorgestellten EFZ-Lehren 4 Jahre.','Plattform- und Applikationsentwicklung sind zwei zusätzliche eigenständige EFZ-Berufe.','Gebäudeinformatik kennt keine Fachrichtungen.'],0,'Wir erkunden fünf EFZ-Berufe in sechs Stationen: Informatik wird mit beiden Fachrichtungen gezeigt. Gebäudeinformatik hat drei Fachrichtungen.']];
const navs=[['start','01','Überblick'],['check','02','Standortcheck'],['missions','03','Praxislabor'],['compare','04','Berufe vergleichen'],['final','05','Abschlusscheck'],['dossier','06','Mein Lernjournal']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}progress()}
function correct(key,qs){return qs.filter((q,i)=>S.answers[key+i]===q[2]).length}function answered(key,qs){return qs.filter((q,i)=>Number.isInteger(S.answers[key+i])).length}function done(j){return correct(j.id,j.q)===j.q.length}function progress(){let n=jobs.filter(done).length;document.getElementById('totalbar').style.width=n/6*100+'%';document.getElementById('totaltext').textContent=n+' von 6 Praxisfällen gelöst';if(!storageOK)document.getElementById('savehint').textContent='Speichern ist hier nicht möglich. Lade dein Lernjournal vor dem Schliessen herunter.'}
const btn=(href,text)=>`<a class="btn primary" href="#${href}">${text} →</a>`;
function note(id,label){return `<label class="block" for="note-${id}">${label}</label><textarea id="note-${id}" data-note="${id}" placeholder="Notiere deine Gedanken …">${esc(S.notes[id]||'')}</textarea>`}
function qhtml(q,key,index){const a=S.answers[key],ok=a===q[2];return `<div class="question"><fieldset><legend>${index+1}. ${q[0]}</legend><div class="options">${q[1].map((o,k)=>`<label class="option"><input type="radio" name="${key}" data-answer="${key}" value="${k}" ${a===k?'checked':''}><span>${o}</span></label>`).join('')}</div></fieldset><div id="fb-${key}" aria-live="polite">${a===undefined?'':feedback(q,ok)}</div></div>`}
function feedback(q,ok){return `<div class="feedback ${ok?'good':'bad'}"><b>${ok?'Richtig.':'Noch nicht ganz.'}</b> ${q[3]}${ok?'':' Du kannst deine Antwort ändern.'}</div>`}
function questionByKey(key){let m=key.match(/^(pre|final|media|business|building|app|platform|support)(\d+)$/);return m?(m[1]==='pre'?pre:m[1]==='final'?finalQ:jobs.find(j=>j.id===m[1]).q)[+m[2]]:null}
function start(){return `<div class="eyebrow">Dein Auftrag · etwa 3 Lektionen</div><h1>Welche Rolle<br>passt zu dir?</h1><p class="intro">Ein Jugendzentrum. Sechs ICT-Rollen. Du entscheidest, testest und findest heraus, was diese Berufe verbindet – und unterscheidet.</p><div class="grid"><section class="panel dark"><span class="tag">Hier beginnen · 15–20 Min.</span><h2 style="margin-top:20px">Entdecke deinen Ausgangspunkt.</h2><p>Was interessiert dich? Was weisst du bereits? Starte ohne Vorbereitung. Vorkenntnisse sind keine Voraussetzung.</p>${btn('check','Standortcheck starten')}<div class="stat">12 Interessenfragen<br>6 kurze Wissensfragen</div></section><section class="panel"><div class="eyebrow">Das kannst du am Ende</div><ul class="goals"><li>Die sechs Rollen anhand eines konkreten Arbeitsergebnisses unterscheiden.</li><li>Mindestens zwei Gemeinsamkeiten erklären.</li><li>Aufträge begründet zuordnen und wichtige Überschneidungen erkennen.</li><li>Zwei passende Richtungen und einen nächsten Erkundungsschritt begründen.</li></ul></section></div><h2 class="sectionhead">So gehst du vor</h2><div class="cards">${[['1','Standort bestimmen','Interessen und Vorwissen getrennt einschätzen.'],['2','Im Dock mitarbeiten','Sechs Fälle lösen, ausprobieren und echte Berufseinblicke ansehen.'],['3','Vergleichen & weitergehen','Wissen prüfen und deine nächsten Schritte festhalten.']].map(x=>`<div class="panel"><div class="badge">${x[0]}</div><h3>${x[1]}</h3><p class="muted">${x[2]}</p></div>`).join('')}</div><p>Schon Vorwissen? Löse den Standortcheck und nutze in jedem Fall die <b>Vertiefung</b>. Alle Stationen bleiben frei zugänglich.</p>${btn('missions','Zum Praxislabor')}<details style="margin-top:25px"><summary>Hinweise für den Unterricht und zur Speicherung</summary><p>Vorschlag: Lektion 1 Standortcheck und erste Fälle; Lektion 2 restliche Fälle und zwei Berufsvideos; Lektion 3 Vergleich, Abschlusscheck und Lernjournal. Umfang etwa 120–150 Minuten, je nach Videolänge. Längere Lehrberufe-Live-Sendungen zusätzlich einplanen.</p><p>Praxisfälle und Zahlen sind didaktisch konstruierte Beispiele, keine dokumentierten Aufträge eines echten Betriebs. Die Berufsbilder stützen sich auf die verlinkten Schweizer Fachquellen (Recherche: 14.09.2026). Tätigkeiten können sich je nach Betrieb überschneiden.</p><p>Antworten und Notizen werden nur in diesem Browser gespeichert. Auf gemeinsam benutzten Geräten am Ende das Journal herunterladen und «Neu beginnen» wählen. Externe Videos und Webseiten brauchen Internet; beim Öffnen gelten die Bedingungen des Anbieters.</p></details>`}
function check(){return `<div class="eyebrow">02 · Standortcheck</div><h1>Wo stehst du heute?</h1><p class="intro">Interesse ist etwas anderes als Vorwissen. Beides kannst du entwickeln. Dieser selbst erstellte Orientierungscheck ist kein standardisierter Eignungstest und keine Zusage oder Absage für eine Lehre.</p><section class="panel"><h2>A · Was würdest du gerne ausprobieren?</h2><p>Bewerte jede Aussage. «Noch unklar» wird nicht als Desinteresse gewertet.</p>${jobs.map(j=>j.interest.map((t,k)=>`<div class="question"><fieldset><legend>${t}</legend><div class="rating">${[['0','Eher nicht'],['1','Vielleicht'],['2','Gerne'],['3','Sehr gerne'],['u','Noch unklar']].map(([v,l])=>`<label class="option"><input type="radio" name="i-${j.id}${k}" data-interest="${j.id}${k}" value="${v}" ${String(S.interests[j.id+k])===v?'checked':''}>${l}</label>`).join('')}</div></fieldset></div>`).join('')).join('')}</section><section class="panel"><h2>B · Was weisst du schon?</h2><p>Keine Noten. Fehler zeigen dir, wo es etwas zu entdecken gibt. Du erhältst jeweils sofort eine Erklärung.</p>${pre.map((q,i)=>qhtml(q,'pre'+i,i)).join('')}</section><button class="btn primary" data-action="profile">Mein Standortprofil anzeigen →</button><div id="profile" style="margin-top:24px">${S.profileSeen?profile():''}</div>`}
function profile(){const count=Object.keys(S.interests).length,known=Object.values(S.interests).filter(x=>x!=='u').length;let ranking=jobs.map(j=>{let v=[S.interests[j.id+'0'],S.interests[j.id+'1']];return {j,v,valid:v.every(x=>x!==undefined&&x!=='u'),score:v.reduce((a,b)=>a+(Number(b)||0),0)}}).sort((a,b)=>b.score-a.score);let eligible=ranking.filter(r=>r.valid);let top=eligible.filter(r=>r.score===eligible[0]?.score);return `<section class="panel"><h2>Dein Standortprofil</h2><p>${count}/12 Interessenfragen beantwortet, davon ${known} einschätzbar. ${answered('pre',pre)}/6 Wissensfragen bearbeitet.</p>${count<12?'<div class="notice">Dein Interessenprofil ist noch unvollständig. Beantworte die übrigen Fragen für einen vollständigen Überblick.</div>':''}${ranking.map(r=>`<div class="step"><div class="barlabel"><b>${r.j.short}</b><span>${r.valid?r.score+' / 6 Punkte':'Noch offen'}</span></div><div class="progress"><i style="width:${r.valid?r.score/6*100:0}%"></i></div><span class="small muted">${r.j.focus}</span></div>`).join('')}<p style="margin-top:20px">${!eligible.length?'Noch zu wenig klare Antworten für einen Vergleich. Erkunde zunächst alle Fälle.':eligible[0].score===0?'Bisher sticht keine Richtung durch Interesse hervor. Nutze die Fälle, um Neues auszuprobieren.':`Unter deinen vollständig eingeschätzten Richtungen liegt ${top.map(r=>r.j.short).join(' / ')} vorne. Beginne dort und vergleiche danach bewusst eine andere Rolle.`}</p><p><b>Vorwissen:</b> Aktuell ${correct('pre',pre)} von 6 richtig. ${correct('pre',pre)>=5?'Nutze auch die Vertiefungen in den Praxisfällen.':'Nutze die Begriffshilfen und die Rückmeldungen im Praxislabor.'}</p><details><summary>Wie entsteht dieses Profil?</summary><p>Pro Richtung werden zwei Interessenantworten mit je 0–3 Punkten addiert. Alle Richtungen haben dasselbe Gewicht. «Noch unklar» und fehlende Antworten ergeben keine Rangbewertung. Gleichstände bleiben bestehen. Die Balken sind keine Eignungsprozente. Der Wissenscheck fliesst nicht in die Interessenwertung ein und zeigt deinen aktuellen, nach Korrekturen veränderbaren Lernstand.</p><p>Ein Beruf lässt sich nicht mit zwei Aussagen vollständig abbilden. Schulische Anforderungen, praktische Erfahrungen und Rückmeldungen aus einer Schnupperlehre helfen dir bei der weiteren Entscheidung.</p></details>${btn('missions','Berufe in der Praxis erkunden')}</section>`}
function missions(){return `<div class="eyebrow">03 · Praxislabor</div><h1>Das Dock braucht dein Team.</h1><p class="intro">Das fiktive Jugendzentrum eröffnet bald. An jedem Teil des Projekts arbeiten andere ICT-Fachleute. Übernimm alle sechs Rollen; rechne mit 7–10 Minuten je Fall, plus Videos.</p><div class="notice"><b>Fünf EFZ-Berufe, sechs Stationen:</b> Informatiker/in EFZ hat die beiden Fachrichtungen Applikationsentwicklung und Plattformentwicklung. Gebäudeinformatiker/in EFZ hat drei Fachrichtungen; unser Fall zeigt Gebäudeautomation.</div><div class="cards">${jobs.map(j=>`<section class="panel card"><div class="row between" style="width:100%"><div class="badge">/${j.code}</div><span class="tag">${done(j)?'✓ Gelöst':answered(j.id,j.q)?'In Arbeit':'Offen'}</span></div><h3>${j.short}</h3><p>${j.title}</p><p class="small muted">${j.focus}<br>${j.years} Jahre · EFZ</p>${btn('job-'+j.id,'Fall übernehmen')}</section>`).join('')}</div><div class="panel"><h2>Die gemeinsame Aufgabe</h2><p>Alle Rollen müssen Bedürfnisse verstehen, sorgfältig testen, verständlich kommunizieren und Informationen schützen. Die Grenzen sind nicht starr: Entscheide in den Aufgaben nach dem <b>fachlichen Schwerpunkt</b>.</p>${btn('compare','Gemeinsamkeiten vergleichen')}</div>`}
function lab(j){if(j.id==='building')return `<div class="lab"><h3>Probier die Lichtregel aus</h3><p>Teste zuerst selbst: In welchen Zuständen geht das Licht an?</p><label class="option"><input id="present" type="checkbox" data-sim="building">Jemand ist im Raum</label><label class="option"><input id="dark" type="checkbox" data-sim="building">Es ist dunkel</label><output id="simout" aria-live="polite">Licht AUS · niemand im Raum</output></div>`;if(j.id==='app')return `<div class="lab"><h3>Teste zwei Buchungsregeln</h3><label for="booked">Bereits gebuchte Plätze (0–15)</label> <input type="number" id="booked" value="12" min="0" max="15" step="1" data-sim="app"><output id="simout" aria-live="polite">Fehlerhafte Regel (≤ 12): nimmt an → 13 Plätze. Korrigierte Regel (&lt; 12): lehnt ab.</output><p class="small" style="margin-top:10px">Das Modell prüft jeweils eine einzelne zusätzliche Buchung.</p></div>`;if(j.id==='business')return `<div class="lab"><h3>Rechne den Nutzen durch</h3><label for="callbacks">Rückfragen nach der Verbesserung (0–12)</label> <input id="callbacks" type="number" min="0" max="12" step="1" value="4" data-sim="business"><output id="simout" aria-live="polite">8 Rückfragen weniger × 5 Minuten = 40 Minuten pro Woche.</output></div>`;return ''}
function job(j){const index=jobs.indexOf(j);return `<a href="#missions">← Alle Praxisfälle</a><div class="eyebrow" style="margin-top:24px">Fall ${j.code} · ${j.years} Jahre · EFZ</div><h1>${j.title}</h1><p class="intro">${j.name}</p><div class="panel dark"><div class="eyebrow">Dein Praxisauftrag</div><p style="font-size:20px;margin-top:12px">${j.case}</p><div class="stat">${j.artifact}</div></div><p><b>Lernziel:</b> Du kannst den Schwerpunkt «${j.focus}» an einer Entscheidung erklären und von einer verwandten Rolle abgrenzen.</p>${lab(j)}<section class="panel"><h2>Du entscheidest</h2>${j.q.map((q,i)=>qhtml(q,j.id+i,i)).join('')}<div id="status-${j.id}" class="notice">${done(j)?'✓ Beide Entscheidungen gelöst. Weiter mit dem Berufseinblick.':'Beantworte beide Fragen. Du darfst mit der Rückmeldung nochmals entscheiden.'}</div></section><section class="panel"><h2>Welche Arbeit steckt dahinter?</h2><p>${j.about}</p><p><b>Ein mögliches Arbeitsergebnis:</b> ${j.result}</p><div class="notice">${j.boundary}</div><details><summary>Vertiefung · für Neugierige und Fortgeschrittene</summary>${note('deep-'+j.id,j.challenge)}<details><summary>Mit einer möglichen Lösung vergleichen</summary><p>${j.model}</p></details></details></section><section class="panel"><div class="eyebrow">Einblick in den echten Berufsalltag</div><h2 style="margin-top:8px">Beobachten statt nur schauen.</h2><p>Öffne den Berufseinblick. Schau während der Lernreise mindestens zwei unterschiedliche Rollen genauer an. Notiere <b>eine beobachtete Tätigkeit, ein Werkzeug und eine Zusammenarbeit</b>. Falls ein Film nicht erreichbar ist, nutze das Berufsprofil.</p><div class="linklist"><a target="_blank" rel="noopener noreferrer" href="https://www.berufsberatung.ch/de/berufe/${j.slug}">Berufsprofil und Berufsvideo · berufsberatung.ch ↗</a><a target="_blank" rel="noopener noreferrer" href="https://www.ict-berufsbildung.ch/grundbildung/ict-lehren/${j.slug}">Offizieller Berufseinblick · ICT-Berufsbildung Schweiz ↗</a><a target="_blank" rel="noopener noreferrer" href="https://www.lehrberufe-live.ch/videos">Betriebseinblicke · Lehrberufe Live! ↗</a></div><p class="small muted">Bei Lehrberufe Live! nach «${j.short}» suchen; das Angebot variiert. Externe Links öffnen ein neues Fenster.</p>${j.id==='business'?`<a class="btn" href="https://www.youtube.com/watch?v=MqY5bkBxTo8" target="_blank" rel="noopener noreferrer">Yousty: Digitales Business beim BIT ↗</a><button class="btn" data-video="MqY5bkBxTo8">Video hier laden</button><div id="video-MqY5bkBxTo8"></div>`:j.id==='app'?`<a class="btn" href="https://www.youtube.com/watch?v=DDyd_knvNPc" target="_blank" rel="noopener noreferrer">Berufsberatung: Applikationsentwicklung ↗</a><button class="btn" data-video="DDyd_knvNPc">Video hier laden</button><div id="video-DDyd_knvNPc"></div>`:`<a href="https://www.yousty.ch/" target="_blank" rel="noopener noreferrer">Yousty · nach «${j.short}» suchen ↗</a>`}${note('video-'+j.id,'Mein Beobachtungsprotokoll (inklusive Quelle oder Videotitel)')}${note('reflect-'+j.id,'Was würde mir an diesem Auftrag gefallen – und was würde mich fordern?')}</section><div class="row">${btn(index<5?'job-'+jobs[index+1].id:'compare',index<5?'Nächsten Fall erkunden':'Zum Berufsvergleich')}</div>`}
function compare(){return `<div class="eyebrow">04 · Verknüpfen</div><h1>Ein Projekt. Andere Schwerpunkte.</h1><p class="intro">Vergleiche die Ergebnisse im Dock. Eine Website kann mehrere Berufe beschäftigen – die konkrete Aufgabe entscheidet.</p><section class="panel"><div class="tablewrap"><table><thead><tr><th>Beruf / Fachrichtung</th><th>Leitfrage im Dock</th><th>Arbeitsergebnis</th><th>Dauer</th></tr></thead><tbody>${jobs.map((j,i)=>`<tr><th scope="row"><a href="#job-${j.id}">${j.short}</a></th><td>${['Wie verstehen und entdecken Jugendliche das Angebot?','Wie wird die Buchung einfacher und effizienter?','Wie arbeiten die technischen Gebäudesysteme zusammen?','Wie funktioniert die Buchung in der Software?','Wie läuft die technische Umgebung zuverlässig?','Wie können Mitarbeitende ihre Geräte und Anwendungen nutzen?'][i]}</td><td>${j.result}</td><td>${j.years} Jahre</td></tr>`).join('')}</tbody></table></div></section><div class="grid"><section class="panel"><h2>Das verbindet alle</h2><ul><li>Probleme und Bedürfnisse verstehen.</li><li>Mit anderen Fachpersonen zusammenarbeiten.</li><li>Lösungen prüfen und dokumentieren.</li><li>Datenschutz und Sicherheit mitdenken.</li><li>Neues lernen und verständlich erklären.</li></ul></section><section class="panel"><h2>Grenzen sind Übergänge</h2><p>Die Mediamatik gestaltet die Buchungsseite. Digitales Business klärt den Ablauf. Die Applikationsentwicklung setzt die Buchung um. Plattformentwicklung betreibt die Umgebung. ICT-Fachleute helfen am Arbeitsplatz. Gebäudeinformatik verbindet die Technik vor Ort.</p><p class="small muted">Vereinfachte Zuordnung im Übungsfall. Die tatsächliche Arbeitsteilung hängt vom Betrieb und vom Projekt ab.</p></section></div><section class="panel"><h2>Erkläre es in deinen Worten</h2>${note('comparison','Wähle zwei Rollen: Was haben sie gemeinsam, und worin unterscheiden sich ihre Arbeitsergebnisse?')}<details><summary>Selbstprüfung für deine Erklärung</summary><p>Hast du beide Rollen genannt? Eine Gemeinsamkeit beschrieben? Für jede Rolle ein konkretes Arbeitsergebnis genannt? Den Unterschied mit dem Schwerpunkt begründet? Verbessere deine Erklärung, wenn etwas fehlt.</p></details></section><details><summary>Begriffe kurz erklärt</summary><p><b>ICT:</b> Informations- und Kommunikationstechnologie. <b>EFZ:</b> Eidgenössisches Fähigkeitszeugnis. <b>Applikation:</b> eine Softwareanwendung. <b>Infrastruktur:</b> technische Grundlage, etwa Netze und Server. <b>Server:</b> stellt Daten oder Dienste bereit. <b>Cloud:</b> IT-Ressourcen, die über ein Netz bereitgestellt werden. <b>Prozess:</b> zusammenhängende Arbeitsschritte. <b>Sensor:</b> erfasst einen Zustand oder Messwert. <b>Backup:</b> Datensicherung für eine spätere Wiederherstellung.</p></details><div style="margin-top:22px">${btn('final','Wissen im neuen Fall prüfen')}</div>`}
function finalPage(){return `<div class="eyebrow">05 · Transfer</div><h1>Neuer Auftrag. Dein Wissen.</h1><p class="intro">Jetzt eröffnet ein Sportverein ein digitales Kursangebot. Ordne die Aufgaben nach ihrem Schwerpunkt zu. Ziel: mindestens 7 von 8 Antworten richtig und eine begründete Erklärung im Lernjournal.</p><section class="panel">${finalQ.map((q,i)=>qhtml(q,'final'+i,i)).join('')}</section><button class="btn primary" data-action="final">Abschluss auswerten →</button><div id="finalresult">${S.finalDone?finalResult():''}</div>`}
function finalResult(){let n=correct('final',finalQ),a=answered('final',finalQ);return `<section class="panel" style="margin-top:22px"><h2>${a<8?'Noch nicht vollständig':n>=7?'Dein Rollenwissen sitzt.':'Du bist auf dem Weg.'}</h2><p>${a}/8 beantwortet · aktuell ${n}/8 richtig. ${a<8?'Beantworte noch alle Fragen.':n>=7?'Das Wissensziel ist erreicht. Halte jetzt deine begründete Berufswahl und einen nächsten Schritt fest.':'Lies die Rückmeldungen, besuche die passenden Fälle nochmals und korrigiere deine Antworten.'}</p><p class="small muted">Das Ergebnis zeigt deinen aktuellen Stand nach möglichen Korrekturen; es ist keine Prüfungsnote und kein Eignungsurteil.</p>${btn('dossier','Mein Lernjournal vervollständigen')}</section>`}
function dossier(){return `<div class="eyebrow">06 · Sichern & weitergehen</div><h1>Das nimmst du mit.</h1><p class="intro">Dein Lernjournal ist die Grundlage für ein Gespräch, eine Schnupperlehre oder die nächste Recherche. Es wird nicht an eine Lehrperson übermittelt.</p><div class="row noprint" style="margin-bottom:22px"><button class="btn primary" data-action="download">Lernjournal herunterladen</button><button class="btn" data-action="print">Drucken / als PDF speichern</button></div><section class="panel"><h2>Mein Lernstand</h2><p>${jobs.filter(done).length}/6 Praxisfälle gelöst · Standortwissen aktuell ${correct('pre',pre)}/6 · Abschlusscheck ${answered('final',finalQ)}/8 beantwortet, ${correct('final',finalQ)}/8 richtig.</p><p>Wissensziel: ${answered('final',finalQ)===8&&correct('final',finalQ)>=7?'erreicht':'noch offen'}. Reflexionen prüfst du mit der Checkliste selbst.</p></section><section class="panel"><h2>Meine nächsten Schritte</h2>${note('choice','Welche zwei Richtungen möchtest du weiter erkunden? Begründe mit deinen Erfahrungen aus den Fällen.')}${note('strength','Was bringst du bereits mit? Was möchtest du noch üben? Nenne je ein Beispiel.')}${note('next','Was machst du als Nächstes konkret – bei wem und bis wann? Zum Beispiel eine Schnupperlehre anfragen.')}${note('ask','Welche Frage möchtest du einer lernenden Person oder einem Lehrbetrieb stellen?')}<details><summary>Checkliste: Sind meine Lernziele sichtbar?</summary><ul><li>Ich kann jede der sechs Rollen einem Arbeitsergebnis zuordnen.</li><li>Ich nenne zwei Gemeinsamkeiten und einen begründeten Unterschied.</li><li>Ich habe mindestens zwei echte Berufseinblicke verglichen.</li><li>Ich begründe zwei Richtungen mit eigenen Beobachtungen.</li><li>Ich habe einen konkreten nächsten Schritt mit Zeitpunkt festgehalten.</li></ul></details></section><section class="panel"><h2>Meine gesammelten Notizen</h2><h3>Berufsvergleich</h3><p style="white-space:pre-wrap">${esc(S.notes.comparison||'Noch keine Notiz im Berufsvergleich.')}</p>${jobs.map(j=>`<details ${S.notes['video-'+j.id]||S.notes['reflect-'+j.id]?'open':''}><summary>${j.short} · ${done(j)?'Fall gelöst':'Fall noch offen'}</summary>${['video','reflect','deep'].map((p,i)=>`<h3>${['Berufseinblick','Meine Einschätzung','Vertiefung'][i]}</h3><p style="white-space:pre-wrap">${esc(S.notes[p+'-'+j.id]||'Noch keine Notiz.')}</p>`).join('')}</details>`).join('')}</section><section class="panel"><h2>Weiter recherchieren</h2><div class="linklist"><a href="https://www.ict-berufsbildung.ch/grundbildung/ict-lehren" target="_blank" rel="noopener noreferrer">ICT-Berufsbildung Schweiz · die Grundbildungen ↗</a><a href="https://www.berufsberatung.ch/de/berufs-check" target="_blank" rel="noopener noreferrer">berufsberatung.ch · ergänzende Berufs-Checks ↗</a><a href="https://www.yousty.ch/" target="_blank" rel="noopener noreferrer">Yousty · Berufe, Betriebe und Lehrstellen ↗</a><a href="https://www.lehrberufe-live.ch/videos" target="_blank" rel="noopener noreferrer">Lehrberufe Live! · Einblicke in Lehrbetriebe ↗</a></div><p>Vergleiche die Anforderungen konkreter Betriebe. Nutze eine Schnupperlehre und bei Bedarf ein Gespräch im BIZ, um deinen Eindruck zu prüfen.</p></section>`}
function render(){let route=location.hash.slice(1)||'start';let j=route.startsWith('job-')?jobs.find(x=>x.id===route.slice(4)):null;let fn={start,check,missions,compare,final:finalPage,dossier}[route]||start;document.getElementById('nav').innerHTML=navs.map(([id,n,t])=>`<a href="#${id}" class="${(j?'missions':route)===id?'active':''}" ${(j?'missions':route)===id?'aria-current="page"':''}><b>${n}</b>${t}</a>`).join('');document.getElementById('main').innerHTML=(j?job(j):fn())+`<footer>ICT Berufslabor · Schweizer Berufsorientierung · Quellenstand 14.09.2026<br>Eigenständig erstelltes Lernangebot; keine offizielle Publikation der verlinkten Anbieter. Fachquellen sind bei den Berufen verlinkt.</footer>`;progress();document.title=(j?j.short:navs.find(n=>n[0]===route)?.[2]||'Lernreise')+' · ICT Berufslabor'}
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.interest){S.interests[t.dataset.interest]=t.value;save();if(S.profileSeen)document.getElementById('profile').innerHTML=profile()}if(t.dataset.answer){let key=t.dataset.answer,q=questionByKey(key);S.answers[key]=+t.value;save();document.getElementById('fb-'+key).innerHTML=feedback(q,+t.value===q[2]);for(let j of jobs){let el=document.getElementById('status-'+j.id);if(el)el.textContent=done(j)?'✓ Beide Entscheidungen gelöst. Weiter mit dem Berufseinblick.':'Beantworte beide Fragen richtig. Nutze die Rückmeldung.'}if(S.finalDone&&document.getElementById('finalresult'))document.getElementById('finalresult').innerHTML=finalResult();if(S.profileSeen&&document.getElementById('profile'))document.getElementById('profile').innerHTML=profile()}if(t.dataset.sim)simulate(t.dataset.sim)});
document.addEventListener('input',e=>{if(e.target.dataset.note){S.notes[e.target.dataset.note]=e.target.value;save()}if(e.target.dataset.sim)simulate(e.target.dataset.sim)});
function simulate(id){let out=document.getElementById('simout');if(id==='building'){let p=document.getElementById('present').checked,d=document.getElementById('dark').checked;out.textContent=p&&d?'Licht AN · anwesend UND dunkel':'Licht AUS · '+(!p?'niemand im Raum':'hell genug')}else if(id==='app'){let raw=document.getElementById('booked').value,n=Number(raw);out.textContent=raw===''||!Number.isInteger(n)||n<0||n>15?'Bitte eine ganze Zahl von 0 bis 15 eingeben.':`Fehlerhafte Regel (≤ 12): ${n<=12?'nimmt an → '+(n+1)+' Plätze':'lehnt ab'}. Korrigierte Regel (< 12): ${n<12?'nimmt an → '+(n+1)+' Plätze':'lehnt ab'}.`}else{let raw=document.getElementById('callbacks').value,n=Number(raw);out.textContent=raw===''||!Number.isInteger(n)||n<0||n>12?'Bitte eine ganze Zahl von 0 bis 12 eingeben.':`${12-n} Rückfragen weniger × 5 Minuten = ${(12-n)*5} Minuten pro Woche.`}}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.action==='profile'){S.profileSeen=true;save();document.getElementById('profile').innerHTML=profile();document.getElementById('profile').scrollIntoView({behavior:'smooth'})}if(t.dataset.action==='final'){S.finalDone=true;save();document.getElementById('finalresult').innerHTML=finalResult();document.getElementById('finalresult').scrollIntoView({behavior:'smooth'})}if(t.dataset.action==='print'){document.querySelectorAll('main details').forEach(d=>d.open=true);window.print()}if(t.dataset.action==='download')download();if(t.dataset.video){document.getElementById('video-'+t.dataset.video).innerHTML=`<p class="small">Externes YouTube-Video geladen. Falls die Einbettung blockiert wird, nutze den Link oben.</p><iframe title="Berufseinblick" src="https://www.youtube-nocookie.com/embed/${t.dataset.video}" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>`;t.disabled=true}if(t.id==='reset'&&confirm('Alle Antworten und Notizen in diesem Browser löschen? Lade bei Bedarf vorher dein Lernjournal herunter.')){S={interests:{},answers:{},notes:{},visits:[],finalDone:false};save();location.hash='start';render()}});
function download(){let text='MEIN ICT-LERNJOURNAL\nDatum: '+new Date().toLocaleDateString('de-CH')+'\n\nINTERESSEN (0–3 je Aussage; u = noch unklar)\n'+jobs.map(j=>j.name+': '+[0,1].map(k=>S.interests[j.id+k]??'unbeantwortet').join(' / ')).join('\n')+'\n\nLERNSTAND (nach möglichen Korrekturen)\nPraxisfälle: '+jobs.filter(done).length+'/6\nStandortwissen: '+correct('pre',pre)+'/6\nAbschluss: '+answered('final',finalQ)+'/8 beantwortet, '+correct('final',finalQ)+'/8 richtig\n\n';const labels={choice:'Meine zwei Richtungen',strength:'Stärken und Lernfelder',next:'Mein nächster Schritt',ask:'Meine Frage an einen Betrieb',comparison:'Gemeinsamkeiten und Unterschiede'};for(let [k,l] of Object.entries(labels))text+=l+'\n'+(S.notes[k]||'Noch offen')+'\n\n';for(let j of jobs){text+=j.name+'\n'+['video','reflect','deep'].map((p,i)=>['Berufseinblick','Einschätzung','Vertiefung'][i]+': '+(S.notes[p+'-'+j.id]||'Noch offen')).join('\n')+'\nQuelle: https://www.berufsberatung.ch/de/berufe/'+j.slug+'\n\n'}text+='Der Interessencheck ist eine Orientierung, kein standardisierter Eignungstest.\n';let url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='Mein-ICT-Lernjournal.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);document.getElementById('main').focus({preventScroll:true})});render();
</script></body></html>
